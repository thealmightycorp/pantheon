     데이터: Supabase pt_ai_usage_run · pt_ai_usage_snapshot — 사무실 PC pantheon/server/ai_usage.py 가 1시간마다 관리 화면을 읽어 넣음 · 볼 수 있는 사람 pt_ai_usage_can() -->
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:var(--fs-body)/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.ai{display:grid;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:var(--fs-small);letter-spacing:.08em;color:var(--muted);font-weight:600}
.head .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--accent-pale);color:var(--accent-ink);font-weight:600;font-size:12px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.live.stale{background:var(--negative-pale);color:var(--negative-ink)}.live.stale i{background:var(--negative)}
.banner{border-radius:var(--radius-row);padding:12px 16px;border:1px solid var(--warning-line);background:var(--warning-pale);color:var(--warning-ink);font-size:13px;display:grid;gap:4px}
.banner b{font-weight:600}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sum>div{background:var(--surface);border-radius:var(--radius-row);padding:12px 14px;min-width:0}
.sum small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.sum b{display:block;font-size:22px;font-weight:700;line-height:1.25;margin-top:2px}
.sum b em{font-style:normal;font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.sum span{display:block;font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border-radius:var(--radius-card);padding:var(--pad);display:grid;gap:12px;min-width:0;align-content:start}
.panel h2{margin:0;font-size:var(--fs-section);font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 small{font-weight:500;color:var(--muted);font-size:12px}
.panel p.note{margin:0;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.tw{overflow-x:auto;background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-row)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--raised)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
td .sm{display:block;color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:var(--pill-neutral-bg);color:var(--pill-neutral-ink);font-size:12px;font-weight:500;white-space:nowrap;margin:0 4px 2px 0}
.chip.ok{background:var(--accent-pale);color:var(--accent-ink)}
.chip.warn{background:var(--warning-pale);color:var(--warning-ink)}
.chip.bad{background:var(--negative-pale);color:var(--negative-ink)}
.unk{color:var(--faint);font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--active);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter{display:grid;gap:6px;background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-row);padding:12px 14px}
.meter .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:13px}
.meter .top b{font-size:18px}
.meters{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.chart{background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-row);padding:12px 14px 8px}
.chart svg{width:100%;height:160px;display:block}
.chart .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input,.tools select{height:34px;padding:0 12px;border:1px solid var(--control);border-radius:10px;background:var(--raised);color:var(--text);font:inherit;font-size:13px}
.tools input{flex:1 1 200px;min-width:0}
.tools input:focus-visible,.tools select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--ground);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:20}
ul.plain{margin:0;padding-left:18px;font-size:13px;display:grid;gap:4px}ul.plain li span{color:var(--muted)}
.gate{max-width:440px;margin:12vh auto;padding:28px;background:var(--surface);border-radius:var(--radius-card);display:grid;gap:12px;text-align:center}
.gate h1{font:600 22px/1.3 var(--serif);margin:0}.gate p{margin:0;color:var(--muted)}
footer{color:var(--faint);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 16px}
@media (max-width:1000px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){th,td{padding:8px 8px}.hide-sm{display:none}.sum b{font-size:19px}}
</style>
</head>
<body>
<div class="pt-app">
  <aside class="pt-sidebar">
    <a class="pt-brand" href="../"><img src="../brand/logo.png" alt=""><span><b>이그드라실</b><small>더올마이티 AX</small></span></a>
    <nav class="pt-nav" aria-label="AX 현황판">
      <a class="pt-nav-item" href="../"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>이그드라실</a>
      <a class="pt-nav-item" href="../server/"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M8 7.5h.01M8 16.5h.01"/></svg>서버 현황</a>
      <a class="pt-nav-item" href="./" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>AI 구독 현황</a>
    </nav>
  </aside>
  <main class="pt-canvas"><div class="pt-column ai" id="app"><div class="gate"><h1>AI 구독 현황</h1><p>불러오는 중…</p></div></div></main>
</div>
<div class="tip" id="tip" hidden></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
const SB = createClient('https://dwoiobqucmikbtikfjwk.supabase.co', 'sb_publishable_K6BW26u2jRkTBDwuMqaaFA_3HkfnOc9');
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const POLL = 60000, STALE = 3 * 3600e3;
const SVC = {claude: 'Claude Team', claude_api: 'Claude API', vercel: 'Vercel Pro', higgsfield: '힉스필드', apify: 'Apify', console: 'Claude API 콘솔', supabase: 'Supabase'};
const ORDER = ['claude', 'claude_api', 'higgsfield', 'vercel', 'apify', 'supabase', 'console'];
let run = null, rows = [], hist = [], lastErr = '', q = '', teamSel = '';

const usd = (v, d = 0) => v == null ? null : 'US$' + Number(v).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const U = (v, d = 0, why = '') => v == null ? `<span class="unk">확인 불가${why ? `(${esc(why)})` : ''}</span>` : usd(v, d);
const tok = v => v == null ? '—' : v >= 1e8 ? (v / 1e8).toFixed(2) + '억' : v >= 1e4 ? Math.round(v / 1e4).toLocaleString() + '만' : v.toLocaleString();
const n0 = v => v == null ? '—' : Number(v).toLocaleString();
const kst = s => s ? new Date(s).toLocaleString('ko-KR', {timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false}) : '—';
function ago(ms) { const m = Math.round(ms / 60000); if (m < 60) return m + '분'; const h = Math.floor(m / 60); return h < 48 ? h + '시간' : Math.floor(h / 24) + '일'; }
const svcRow = s => rows.find(r => r.service === s && r.kind === 'service');

// 사람 단위로 묶기: 이메일 → 이름·팀, 서비스 좌석, Claude 사용·활용
function people() {
  const P = new Map();
  const key = r => (r.name && r.team !== '구성원 명단에 없음' ? r.name + '|' + r.team : r.email);
  for (const r of rows.filter(r => r.kind === 'seat' || r.kind === 'activity')) {
    const k = key(r);
    const p = P.get(k) || {name: r.name || r.email, team: r.team || '구성원 명단에 없음', emails: new Set(), seats: [], monthly: 0, monthlyUnknown: false, used: null, act: {}};
    p.emails.add(r.email);
    if (r.kind === 'seat') {
      p.seats.push({svc: r.service, plan: r.plan, usd: r.monthly_usd, note: r.note});
      if (r.monthly_usd == null) p.monthlyUnknown = true; else p.monthly += Number(r.monthly_usd);
      if (r.service === 'claude' && r.used_usd != null) p.used = (p.used || 0) + Number(r.used_usd);
    } else Object.assign(p.act, r.data || {});
    P.set(k, p);
  }
  return [...P.values()];
}
const hasAct = p => Object.values(p.act).some(v => Number(v) > 0) || (p.used || 0) > 0;

function spark(points) {
  // 한 계열 막대(날짜별 추정 금액) — 마우스를 올리면 그날 값
  if (!points.length) return '<p class="note">기록이 없습니다.</p>';
  const W = 600, H = 160, P = 4, max = Math.max(...points.map(p => p.usd)) || 1, bw = (W - 2 * P) / points.length;
  const bars = points.map((p, i) => { const h = Math.max(1, (H - 2 * P) * p.usd / max), x = P + i * bw;
    return `<rect x="${(x + 1).toFixed(1)}" y="${(H - P - h).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)" data-tip="${esc(p.day.slice(5).replace('-', '/'))} · ${usd(p.usd, 2)}${p.tokens != null ? ` · ${tok(p.tokens)} 토큰` : ''}${p.calls != null ? ` · ${n0(p.calls)}회` : ''}"/>`; }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="날짜별 Claude API 금액">
    <line x1="${P}" x2="${W - P}" y1="${H - P}" y2="${H - P}" stroke="var(--rule)" vector-effect="non-scaling-stroke"/>${bars}</svg>
    <div class="axis"><span>${points[0].day.slice(5).replace('-', '/')}</span><span>가장 높은 날 ${usd(max, 0)}</span><span>${points.at(-1).day.slice(5).replace('-', '/')}</span></div></div>`;
}

function render() {
  const st = run.status || {}, age = Date.now() - new Date(run.run_at).getTime(), stale = age > STALE;
  const c = svcRow('claude'), cd = c?.data || {}, api = svcRow('claude_api'), ad = api?.data || {};
  const v = svcRow('vercel'), h = svcRow('higgsfield'), hd = h?.data || {}, ap = svcRow('apify');
  const fixed = [c, v, h, ap, svcRow('supabase')].filter(Boolean), fixedSum = fixed.reduce((a, r) => a + (Number(r.monthly_usd) || 0), 0);
  const fails = ORDER.filter(k => st[k] && !st[k].ok);
  const P = people(), teams = [...new Set(P.map(p => p.team))].sort((a, b) => a.localeCompare(b, 'ko'));
  const claudeSeats = rows.filter(r => r.service === 'claude' && r.kind === 'seat');
  const idle = P.filter(p => p.seats.some(s => s.svc === 'claude') && !hasAct(p));
  // 팀별 합계
  const T = teams.map(t => { const ps = P.filter(p => p.team === t);
    return {t, n: ps.length, seats: ps.reduce((a, p) => a + p.seats.length, 0), monthly: ps.reduce((a, p) => a + p.monthly, 0),
      unk: ps.some(p => p.monthlyUnknown), used: ps.reduce((a, p) => a + (p.used || 0), 0), active: ps.filter(hasAct).length}; })
    .sort((a, b) => b.monthly - a.monthly);
  const shown = P.filter(p => (!teamSel || p.team === teamSel) && (!q || (p.name + ' ' + p.team + ' ' + [...p.emails].join(' ')).toLowerCase().includes(q)))
    .sort((a, b) => b.monthly - a.monthly || (b.used || 0) - (a.used || 0) || a.name.localeCompare(b.name, 'ko'));
  const byUsd = (a, b) => Number(b.used_usd || 0) - Number(a.used_usd || 0);
  const apiAll = rows.filter(r => r.service === 'claude_api' && r.kind === 'api');
  const real = ad.source === 'Claude 콘솔 실제값';
  const keyRows = apiAll.filter(r => r.data?.group === 'key').sort(byUsd), modelRows = apiAll.filter(r => r.data?.group === 'model').sort(byUsd);
  const apiRows = apiAll.filter(r => (r.data?.group || 'bot') === 'bot').sort(byUsd);
  const full = cd.activity_full || {}, allFull = Object.keys(full).length > 0 && Object.values(full).every(Boolean);
  const sb = svcRow('supabase'), sbd = sb?.data || {};
  const trend = real && ad.daily_console?.length ? ad.daily_console.map(d => ({day: '2026-' + d.day, usd: d.total, tokens: null, calls: null})) : (ad.bot_daily || ad.daily || []);
  const seatChip = s => `<span class="chip ${s.svc === 'claude' && s.plan === 'Premium' ? 'ok' : ''}" title="${esc(s.note || '')}">${esc(SVC[s.svc] || s.svc)}${s.plan ? ' · ' + esc(s.plan) : ''}</span>`;
  const actTxt = p => { const a = p.act, out = [];
    if (a.messages_30d) out.push(`메시지 ${n0(a.messages_30d)}`); if (a.code_lines_month) out.push(`코드 ${n0(a.code_lines_month)}줄`);
    if (a.code_sessions_30d) out.push(`Code 세션 ${n0(a.code_sessions_30d)}`);
    if (a.artifacts_30d) out.push(`아티팩트 ${n0(a.artifacts_30d)}`); return out.join(' · '); };
  const used = cd.usage_limit ? Math.min(100, (c.used_usd || 0) / cd.usage_limit * 100) : null;
  const hcred = hd.credits_month ? Math.min(100, (hd.credits_used || 0) / hd.credits_month * 100) : null;

  $app.innerHTML = `
  <header class="head">
    <div><div class="eyebrow">AI SUBSCRIPTIONS · 더올마이티</div><h1 class="pt-title" style="margin:4px 0 0">AI 구독·사용 현황</h1></div>
    <div class="meta"><span class="live ${stale ? 'stale' : ''}"><i></i>${stale ? '수집 멈춤' : '실시간'} · ${ago(age)} 전 수집</span><span>${kst(run.run_at)} 기준 · 1시간마다 관리 화면에서 읽음</span></div>
  </header>
  ${stale ? `<div class="banner" role="alert"><b>${ago(age)} 동안 새 수집이 없습니다.</b><span>사무실 PC가 꺼졌거나 예약 작업 PANTHEON_AI_USAGE 가 멈췄을 수 있습니다. 아래는 ${kst(run.run_at)} 기준입니다.</span></div>` : ''}
  ${fails.length ? `<div class="banner" role="status"><b>읽지 못한 곳 ${fails.length}곳</b>${fails.map(k => `<span>${esc(SVC[k] || k)} — ${esc(st[k].why || '')}</span>`).join('')}</div>` : ''}

  <section class="sum" aria-label="요약">
    <div><small>월 고정 구독비</small><b class="num">${usd(fixedSum)}</b><span>${fixed.map(r => `${SVC[r.service]} ${usd(r.monthly_usd)}`).join(' · ')}${st.supabase && !st.supabase.ok ? ' · Supabase 확인 불가' : ''}</span></div>
    <div><small>Claude 사용 크레딧 (이번 달)</small><b class="num">${U(c?.used_usd, 2)}<em>/ ${usd(cd.usage_limit) || '한도 확인 불가'}</em></b><span>${cd.usage_reset ? esc(cd.usage_reset) + ' 초기화' : ''}${cd.usage_balance != null ? ` · 잔액 ${usd(cd.usage_balance, 2)}` : ''}</span></div>
    <div><small>Claude API (이번 달 · ${real ? '콘솔 실제' : '봇 기록 추정'})</small><b class="num">${U(api?.used_usd, 0)}</b><span>${tok(api?.tokens)} 토큰${real ? `${ad.credit_balance != null ? ` · 크레딧 잔액 ${usd(ad.credit_balance, 2)}` : ''}${ad.bot_usd != null ? ` · 봇 기록 추정 ${usd(ad.bot_usd)}(참고)` : ''}` : ' · 실제 청구는 확인 불가(콘솔 로그인 필요)'}</span></div>
    <div><small>Claude 활용 (주간 활성)</small><b class="num">${cd.weekly_active ?? '—'}<em>/ ${cd.seats ?? claudeSeats.length}석</em></b><span>${cd.adoption ? `매일 쓰는 사람 ${cd.adoption.daily}명 · 월간 ${cd.adoption.monthly}명` : '분석 화면 확인 불가'}</span></div>
  </section>

  <section class="panel" id="services">
    <h2>서비스별 구독 <small>요금제 · 좌석 · 월 고정 · 이번 달 사용 · 다음 청구</small></h2>
    <div class="tw"><table><thead><tr><th>서비스</th><th>요금제·좌석</th><th class="r">월 고정</th><th class="r">이번 달 사용</th><th class="hide-sm">다음 청구</th></tr></thead><tbody>
      ${ORDER.map(k => { const r = svcRow(k), s = st[k] || {}, d = r?.data || {};
        if (!r && s.ok !== false) return '';
        if (!r) return `<tr><td><b>${esc(SVC[k])}</b></td><td colspan="4"><span class="chip bad">확인 불가</span> <span class="unk">${esc(s.why || '')}</span></td></tr>`;
        const usedCell = k === 'claude' ? `${U(r.used_usd, 2)}<span class="sm">사용 크레딧(좌석 한도 넘긴 몫)</span>`
          : k === 'claude_api' ? `${U(r.used_usd, 2)}<span class="sm">${tok(r.tokens)} 토큰 · ${real ? `콘솔 실제값${d.cost?.web_search != null ? ` · 웹 검색 ${usd(d.cost.web_search, 2)} 포함` : ''}` : '봇 기록 추정'}</span>`
          : k === 'supabase' ? `${U(r.used_usd, 2)}<span class="sm">이번 주기 현재(${esc(d.cycle_start || '')}부터)</span>`
          : k === 'vercel' ? `${U(r.used_usd, 2)}<span class="sm">사용량(포함 크레딧 ${usd(d.included_credit)}에서 차감)</span>`
          : k === 'apify' ? `${U(r.used_usd, 2)}<span class="sm">선불 ${usd(r.monthly_usd)} 중 · 남은 ${usd(d.prepaid_left, 2)}</span>`
          : k === 'higgsfield' ? `${d.credits_used != null ? n0(d.credits_used) + ' 크레딧' : '<span class="unk">확인 불가</span>'}<span class="sm">월 ${n0(d.credits_month)} 중 · 남은 ${n0(d.credits_left)}</span>` : U(r.used_usd, 2);
        const fixedCell = k === 'claude_api' ? `<span class="unk">사용량 과금</span>${cd.api_credit_month ? `<span class="sm">Team 포함 월 ${usd(cd.api_credit_month)} 크레딧</span>` : ''}` : U(r.monthly_usd);
        return `<tr><td><b>${esc(SVC[k])}</b></td><td>${esc(r.plan)}</td><td class="r num">${fixedCell}</td><td class="r num">${usedCell}</td>
          <td class="hide-sm">${d.next_invoice != null ? usd(d.next_invoice) : ''}${d.next_invoice_date ? `<span class="sm">${esc(d.next_invoice_date)}</span>` : d.period ? `<span class="sm">${esc(d.period)}</span>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="note">월 고정은 각 관리 화면의 다음 청구 예정액입니다. Claude 좌석 단가(표준 US$25 · Premium US$125)는 화면에 없어 다음 청구액과 좌석 수가 맞을 때만 사람별로 나눴습니다${cd.seat_price_ok === false ? ' — 이번엔 맞지 않아 사람별 좌석비는 확인 불가' : ''}.</p>
  </section>

  <section class="panel" id="teams">
    <h2>팀별 <small>사람 수 · 좌석 · 월 좌석비 · Claude 이번 달 사용 크레딧 · 활용 근거 있는 사람</small></h2>
    <div class="tw"><table><thead><tr><th>팀</th><th class="r">사람</th><th class="r">좌석</th><th class="r">월 좌석비</th><th class="r hide-sm">Claude 사용</th><th class="r hide-sm">활용 확인</th></tr></thead><tbody>
      ${T.map(t => `<tr><td><a href="#people" data-team="${esc(t.t)}">${esc(t.t)}</a></td><td class="r num">${t.n}</td><td class="r num">${t.seats}</td><td class="r num">${usd(t.monthly)}${t.unk ? '<span class="sm">일부 확인 불가</span>' : ''}</td><td class="r num hide-sm">${usd(t.used, 2)}</td><td class="r num hide-sm">${t.active}/${t.n}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="note">팀은 헤임달 구성원 명단(hd_member)의 부서입니다. 명단에 없는 주소는 「구성원 명단에 없음」으로 따로 묶었습니다.</p>
  </section>

  <section class="panel" id="people">
    <h2>직원별 <small>${shown.length}명${teamSel ? ` · ${esc(teamSel)}` : ''}</small></h2>
    <div class="tools"><input id="q" type="search" placeholder="이름·팀·메일 찾기" value="${esc(q)}" aria-label="직원 찾기">
      <select id="team" aria-label="팀 고르기"><option value="">모든 팀</option>${teams.map(t => `<option ${t === teamSel ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
    <div class="tw"><table><thead><tr><th>이름</th><th>구독 좌석</th><th class="r">월 좌석비</th><th class="r">Claude 이번 달</th><th class="hide-sm">활용(최근 30일${allFull ? '' : ' 상위 목록'})</th></tr></thead><tbody>
      ${shown.map(p => `<tr><td><b>${esc(p.name)}</b><span class="sm">${esc(p.team)}</span></td><td>${p.seats.map(seatChip).join('') || '<span class="unk">좌석 없음</span>'}</td>
        <td class="r num">${p.seats.length ? usd(p.monthly) : '—'}${p.monthlyUnknown ? '<span class="sm">일부 확인 불가</span>' : ''}</td>
        <td class="r num">${p.used == null ? '—' : usd(p.used, 2)}</td>
        <td class="hide-sm">${actTxt(p) ? esc(actTxt(p)) : p.seats.some(s => s.svc === 'claude') ? `<span class="unk">${(p.used || 0) > 0 ? '사용 크레딧 씀' : allFull ? '최근 30일 활동 기록 없음' : '상위 목록 밖(확인 불가)'}</span>` : '—'}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="note">힉스필드 멤버 ${hd.seats_seen ?? '—'}명 / 전체 ${hd.seats ?? '—'}석을 읽었습니다${hd.seats && hd.seats_seen < hd.seats ? '(일부는 읽지 못함)' : ''}. 멤버별 크레딧 사용은 Enterprise 요금제 전용이라 확인 불가입니다.</p>
  </section>

  <div class="grid2">
    <section class="panel" id="api">
      <h2>Claude API 사용 <small>이번 달 · ${real ? 'Claude 콘솔 실제값' : '판테온 봇 기록(표준 단가 추정)'}</small></h2>
      ${real ? `<div class="tw"><table><thead><tr><th>API 키</th><th class="hide-sm">워크스페이스</th><th class="r">금액</th><th class="r">토큰</th></tr></thead><tbody>
        ${keyRows.map(r => `<tr><td>${esc(r.name)}${r.data?.status && r.data.status !== 'active' ? ' <span class="chip">꺼짐</span>' : ''}</td><td class="hide-sm">${esc(r.data?.workspace || '')}</td><td class="r num">${r.used_usd == null ? '—' : usd(r.used_usd, 2)}</td><td class="r num">${tok(r.tokens)}</td></tr>`).join('') || '<tr><td colspan="4" class="unk">기록 없음</td></tr>'}
      </tbody></table></div>
      <div class="tw"><table><thead><tr><th>모델</th><th class="r">금액</th></tr></thead><tbody>
        ${modelRows.map(r => `<tr><td>${esc(r.name)}</td><td class="r num">${usd(r.used_usd, 2)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="note">총액 ${usd(ad.month_spend, 2)} = 토큰 ${usd(ad.cost?.token, 2)} · 웹 검색 ${usd(ad.cost?.web_search, 2)} · 코드 실행 ${usd(ad.cost?.code_exec, 2)} · 입력 ${tok(ad.input_tokens)} · 출력 ${tok(ad.output_tokens)} 토큰${ad.cost?.as_of ? ` · 콘솔 ${esc(ad.cost.as_of)} 기준` : ''}. ${esc(ad.breakdown_note || '')}. 활성 키 ${ad.keys_active ?? '—'}/${ad.keys_total ?? '—'}개.</p>` : ''}
      <details ${real ? '' : 'open'}><summary style="cursor:pointer;font-size:13px;color:var(--accent)">판테온 봇 기록(기능·모델별 추정${ad.bot_usd != null ? ` ${usd(ad.bot_usd)}` : ''}) ${real ? '— 참고용' : ''}</summary>
      <div class="tw" style="margin-top:8px"><table><thead><tr><th>기능</th><th class="hide-sm">모델</th><th class="r">추정 금액</th><th class="r">토큰</th><th class="r hide-sm">호출</th></tr></thead><tbody>
        ${apiRows.slice(0, 15).map(r => `<tr><td>${esc(r.name)}</td><td class="hide-sm">${esc(r.plan)}</td><td class="r num">${usd(r.used_usd, 2)}</td><td class="r num">${tok(r.tokens)}</td><td class="r num hide-sm">${n0(r.data?.calls)}</td></tr>`).join('') || '<tr><td colspan="5" class="unk">기록 없음</td></tr>'}
        ${apiRows.length > 15 ? `<tr><td colspan="5" class="unk">그 밖 ${apiRows.length - 15}개 · ${usd(apiRows.slice(15).reduce((a, r) => a + Number(r.used_usd || 0), 0), 2)}</td></tr>` : ''}
      </tbody></table></div>
      <p class="note">${real ? esc(ad.bot_note || '') : esc(ad.missing || '')}</p></details>
    </section>
    <section class="panel" id="trend">
      <h2>API 추이 <small>이번 달 날짜별 금액 · ${real ? '콘솔(UTC 날짜)' : '봇 기록 추정'}</small></h2>
      ${spark(trend)}
      ${sb ? `<h2 style="margin-top:6px">Supabase 프로젝트별 <small>이번 주기 컴퓨트 · ${esc(sbd.cycle_start || '')} ~ ${esc(sbd.next_invoice_date || '')}</small></h2>
      <div class="tw"><table><thead><tr><th>프로젝트</th><th class="r">금액</th></tr></thead><tbody>
        ${(sbd.projects || []).map(x => `<tr><td>${esc(x.name)}${x.status && x.status !== 'ACTIVE_HEALTHY' ? ` <span class="chip">${esc(x.status === 'REMOVED' ? '삭제됨' : x.status)}</span>` : ''}</td><td class="r num">${usd(x.usd, 2)}</td></tr>`).join('')}
        ${(sbd.lines || []).filter(x => !/Compute Hours/.test(x.item || '')).map(x => `<tr><td class="unk">${esc(x.item)}</td><td class="r num">${usd(x.usd, 2)}</td></tr>`).join('')}
      </tbody></table></div><p class="note">예상 청구 ${usd(sbd.next_invoice, 2)} · 지금까지 ${usd(sbd.current, 2)} (Pro 요금제 + 컴퓨트, 컴퓨트 크레딧 반영)</p>` : ''}
      ${cd.products && Object.keys(cd.products).length ? `<h2 style="margin-top:6px">Claude Team 사용 크레딧 제품별 <small>이번 달 · 월말 예상</small></h2>
      <div class="tw"><table><thead><tr><th>제품</th><th class="r">이번 달</th><th class="r">월말 예상</th></tr></thead><tbody>
        ${Object.entries(cd.products).map(([k, x]) => `<tr><td>${esc(k)}</td><td class="r num">${usd(x.month, 2)}</td><td class="r num">${usd(x.forecast, 2)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${hist.length > 1 ? `<p class="note">수집 기록 ${hist.length}회 · Claude 사용 크레딧 ${usd(hist[0].used_usd, 2)} → ${usd(hist.at(-1).used_usd, 2)} (${kst(hist[0].run_at)} ~ ${kst(hist.at(-1).run_at)})</p>` : ''}
    </section>
  </div>

  <section class="panel" id="usage">
    <h2>활용도 <small>좌석 대비 실제 사용</small></h2>
    <div class="meters">
      ${used != null ? `<div class="meter"><div class="top"><span>Claude 사용 크레딧 한도</span><b class="num">${used.toFixed(0)}%</b></div><div class="bar"><i style="width:${used}%"></i></div><span class="unk">${usd(c.used_usd, 2)} / ${usd(cd.usage_limit)}</span></div>` : ''}
      ${cd.adoption ? `<div class="meter"><div class="top"><span>Claude 매일 쓰는 사람</span><b class="num">${cd.adoption.daily}/${cd.seats}</b></div><div class="bar"><i style="width:${cd.adoption.daily / cd.seats * 100}%"></i></div><span class="unk">주간 ${cd.adoption.weekly} · 월간 ${cd.adoption.monthly} (분석 화면, 어제 기준)</span></div>` : ''}
      ${hcred != null ? `<div class="meter"><div class="top"><span>힉스필드 월 크레딧</span><b class="num">${hcred.toFixed(0)}%</b></div><div class="bar"><i style="width:${hcred}%"></i></div><span class="unk">${n0(hd.credits_used)} / ${n0(hd.credits_month)} 사용</span></div>` : ''}
      ${v ? `<div class="meter"><div class="top"><span>Vercel 포함 크레딧</span><b class="num">${v.data?.included_credit ? ((v.data.included_credit_used || 0) / v.data.included_credit * 100).toFixed(0) : '—'}%</b></div><div class="bar"><i style="width:${v.data?.included_credit ? (v.data.included_credit_used || 0) / v.data.included_credit * 100 : 0}%"></i></div><span class="unk">${usd(v.data?.included_credit_used, 2)} / ${usd(v.data?.included_credit)}</span></div>` : ''}
    </div>
    <h2 style="margin-top:4px">안 쓰는 좌석 후보 <small>Claude · ${idle.length}명 · 월 ${usd(idle.reduce((a, p) => a + p.seats.filter(s => s.svc === 'claude').reduce((x, s) => x + (Number(s.usd) || 0), 0), 0))}</small></h2>
    <p class="note">${allFull ? '이번 달 사용 크레딧이 US$0 이고 최근 30일 분석 화면 전원 목록(메시지·코드·아티팩트·지출)에 활동이 없는 사람입니다. 개인 사정(휴가·입사 직후)이 있을 수 있어 정리 전에 본인 확인이 필요합니다.' : '이번 달 사용 크레딧이 US$0 이고 최근 30일 분석 화면 상위 목록에도 없는 사람입니다. 일부 목록은 상위 멤버만 읽혀 「안 씀」이 아니라 「활용 확인 안 됨」입니다 — 정리 전에 본인 확인이 필요합니다.'}</p>
    <div>${idle.map(p => `<span class="chip warn">${esc(p.name)} · ${esc(p.team)}</span>`).join('') || '<span class="unk">없음</span>'}</div>
  </section>

  <section class="panel" id="unknown">
    <h2>확인 불가 항목 <small>지어내지 않고 이유를 남깁니다</small></h2>
    <ul class="plain">
      ${fails.map(k => `<li>${esc(SVC[k])} <span>— ${esc(st[k].why || '')}</span></li>`).join('')}
      ${allFull ? '' : `<li>Claude 사람별 활용 <span>— ${esc(cd.activity_note || '분석 화면 확인 불가')}</span></li>`}
      <li>힉스필드 멤버별 크레딧 <span>— ${esc(hd.member_note || 'Enterprise 요금제 전용')}</span></li>
      ${real ? '<li>Claude API 사람별 사용 <span>— 콘솔은 API 키·워크스페이스·모델 단위로만 나눔(키가 프로그램별이라 사람과 1:1 아님)</span></li>' : '<li>Claude API 실제 청구·키별 금액 <span>— 콘솔(platform.claude.com) 로그인 필요. 위 금액은 판테온 봇이 호출마다 적은 표준 단가 추정치</span></li>'}
    </ul>
  </section>

  <footer><span>사무실 PC가 1시간마다 관리 화면을 읽어 넣고, 이 화면은 1분마다 새로 읽습니다.</span><span>마지막 수집 ${kst(run.run_at)} · ${run.secs ?? '—'}초</span>${lastErr ? `<span style="color:var(--negative)">읽기 오류: ${esc(lastErr)}</span>` : ''}</footer>`;
}

$app.addEventListener('input', e => { if (e.target.id === 'q') { q = e.target.value.trim().toLowerCase(); const pos = e.target.selectionStart; render(); const el = document.getElementById('q'); el.focus(); el.setSelectionRange(pos, pos); } });
$app.addEventListener('change', e => { if (e.target.id === 'team') { teamSel = e.target.value; render(); } });
$app.addEventListener('click', e => { const a = e.target.closest('a[data-team]'); if (a) { e.preventDefault(); teamSel = a.dataset.team; q = ''; render(); document.getElementById('people').scrollIntoView({behavior: 'smooth'}); } });
document.addEventListener('pointermove', e => {
  const tip = document.getElementById('tip'), t = e.target.closest?.('[data-tip]');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, e.clientX + 12) + 'px'; tip.style.top = (e.clientY - 34) + 'px';
});

async function load() {
  const r1 = await SB.from('pt_ai_usage_run').select('run_at,host,status,secs').order('run_at', {ascending: false}).limit(1);
  if (r1.error) { lastErr = r1.error.message; if (run) render(); else $app.innerHTML = `<div class="gate"><h1>AI 구독 현황</h1><p>읽기 오류: ${esc(lastErr)}</p></div>`; return; }
  if (!r1.data.length) { $app.innerHTML = `<div class="gate"><h1>AI 구독 현황</h1><p>이 화면을 볼 수 있는 권한이 없거나 아직 수집 기록이 없습니다.<br>필요하면 AX팀 김현우에게 요청해 주세요.</p><a class="pt-btn" href="../">이그드라실로 돌아가기</a></div>`; return false; }
  const latest = r1.data[0];
  const [r2, r3] = await Promise.all([
    SB.from('pt_ai_usage_snapshot').select('service,kind,email,name,team,company,plan,monthly_usd,used_usd,tokens,data,note').eq('run_at', latest.run_at).limit(2000),
    SB.from('pt_ai_usage_snapshot').select('run_at,used_usd').eq('service', 'claude').eq('kind', 'service').gte('run_at', new Date(Date.now() - 31 * 86400e3).toISOString()).order('run_at').limit(1000)]);
  if (r2.error) { lastErr = r2.error.message; if (run) render(); return; }
  lastErr = ''; run = latest; rows = r2.data || []; hist = r3.data || [];
  render(); return true;
}

(async () => {
  const { data: { session } } = await SB.auth.getSession();
  if (!session) { $app.innerHTML = `<div class="gate"><h1>AI 구독 현황</h1><p>이그드라실(헤임달 계정·슬랙)로 로그인한 뒤 다시 열어 주세요.</p><a class="pt-btn" href="../">이그드라실에서 로그인</a></div>`; return; }
  if (await load() === false) return;
  setInterval(() => { if (!document.hidden) load(); }, POLL);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
</script>
</body>
</html>
