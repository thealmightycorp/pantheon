<style>
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:var(--fs-body)/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.ai{display:grid;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:var(--fs-small);letter-spacing:.08em;color:var(--muted);font-weight:600}
.head .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.live{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--accent-pale);color:var(--accent-ink);font-weight:600;font-size:12px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.live.stale{background:var(--negative-pale);color:var(--negative-ink)}.live.stale i{background:var(--negative)}
.banner{border-radius:var(--radius-row);padding:12px 16px;border:1px solid var(--warning-line);background:var(--warning-pale);color:var(--warning-ink);font-size:13px;display:grid;gap:4px}
.banner b{font-weight:600}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sum>div{background:var(--surface);border-radius:var(--radius-row);padding:12px 14px;min-width:0}
.sum small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.sum b{display:block;font-size:22px;font-weight:700;line-height:1.25;margin-top:2px}
.sum b em{font-style:normal;font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
.sum span{display:block;font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border-radius:var(--radius-card);padding:var(--pad);display:grid;gap:12px;min-width:0;align-content:start}
.panel h2{margin:0;font-size:var(--fs-section);font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h2 small{font-weight:500;color:var(--muted);font-size:12px}
.panel p.note{margin:0;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.tw{overflow-x:auto;background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-row)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--raised)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
td .sm{display:block;color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:var(--pill-neutral-bg);color:var(--pill-neutral-ink);font-size:12px;font-weight:500;white-space:nowrap;margin:0 4px 2px 0}
.chip.ok{background:var(--accent-pale);color:var(--accent-ink)}
.chip.warn{background:var(--warning-pale);color:var(--warning-ink)}
.chip.bad{background:var(--negative-pale);color:var(--negative-ink)}
.unk{color:var(--faint);font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--active);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter{display:grid;gap:6px;background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-row);padding:12px 14px}
.meter .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:13px}
.meter .top b{font-size:18px}
.meters{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.chart{background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-row);padding:12px 14px 8px}
.chart svg{width:100%;height:160px;display:block}
.chart .axis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input,.tools select{height:34px;padding:0 12px;border:1px solid var(--control);border-radius:10px;background:var(--raised);color:var(--text);font:inherit;font-size:13px}
.tools input{flex:1 1 200px;min-width:0}
.tools input:focus-visible,.tools select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tip{position:fixed;pointer-events:none;background:var(--text);color:var(--ground);font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:20}
ul.plain{margin:0;padding-left:18px;font-size:13px;display:grid;gap:4px}ul.plain li span{color:var(--muted)}
.gate{max-width:440px;margin:12vh auto;padding:28px;background:var(--surface);border-radius:var(--radius-card);display:grid;gap:12px;text-align:center}
.gate h1{font:600 22px/1.3 var(--serif);margin:0}.gate p{margin:0;color:var(--muted)}
footer{color:var(--faint);font-size:12px;display:flex;flex-wrap:wrap;gap:6px 16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:-4px}
.tabs a{padding:8px 14px;border-radius:10px 10px 0 0;color:var(--muted);font-weight:600;font-size:14px;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--text)}.tabs a[aria-current=page]{color:var(--text);border-bottom-color:var(--accent)}
.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
@media (max-width:1000px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){th,td{padding:8px 8px}.hide-sm{display:none}.sum b{font-size:19px}}
</style>
</head>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';
const SB = createClient('https://dwoiobqucmikbtikfjwk.supabase.co', 'sb_publishable_K6BW26u2jRkTBDwuMqaaFA_3HkfnOc9');
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const POLL = 60000, STALE = 3 * 3600e3;
const SVC = {claude: 'Claude Team', claude_api: 'Claude API', vercel: 'Vercel Pro', higgsfield: '힉스필드', apify: 'Apify', console: 'Claude API 콘솔', supabase: 'Supabase'};
const ORDER = ['claude', 'claude_api', 'higgsfield', 'vercel', 'apify', 'supabase', 'console'];
let run = null, rows = [], hist = [], lastErr = '', q = '', teamSel = '';

const usd = (v, d = 0) => v == null ? null : 'US$' + Number(v).toLocaleString('en-US', {minimumFractionDigits: d, maximumFractionDigits: d});
const U = (v, d = 0, why = '') => v == null ? `<span class="unk">확인 불가${why ? `(${esc(why)})` : ''}</span>` : usd(v, d);
const tok = v => v == null ? '—' : v >= 1e8 ? (v / 1e8).toFixed(2) + '억' : v >= 1e4 ? Math.round(v / 1e4).toLocaleString() + '만' : v.toLocaleString();
const n0 = v => v == null ? '—' : Number(v).toLocaleString();
const kst = s => s ? new Date(s).toLocaleString('ko-KR', {timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false}) : '—';
function ago(ms) { const m = Math.round(ms / 60000); if (m < 60) return m + '분'; const h = Math.floor(m / 60); return h < 48 ? h + '시간' : Math.floor(h / 24) + '일'; }
const svcRow = s => rows.find(r => r.service === s && r.kind === 'service');

// ───────────── 힉스필드 API 탭 (11-24 · 회사 MCP 힉스필드 생성 시범) — pt_hf_gen · pt_hf_limit
const SCALE_SEAT = 215, HF_DEF = 30;
const HF_ST = {queued: '대기 중', in_progress: '만드는 중', completed: '완료', failed: '실패', nsfw: '내용 검사 거절', canceled: '취소', error: '오류'};
const HF_PERIODS = {month: '이번 달', last: '지난달', d7: '최근 7일', d30: '최근 30일', d90: '최근 90일'};
let hf = null, hfPeriod = 'month', hfUnit = 'day', hfQ = '', hfTeam = '', hfEdit = '', hfErr = '';
const kstDay = s => new Date(new Date(s).getTime() + 9 * 3600e3).toISOString().slice(0, 10);
const monthStart = (off = 0) => { const k = new Date(Date.now() + 9 * 3600e3); const d = new Date(Date.UTC(k.getUTCFullYear(), k.getUTCMonth() + off, 1)); return new Date(d.getTime() - 9 * 3600e3); };
const hfCost = r => r.status === 'completed' ? Number(r.usd) : ['queued', 'in_progress'].includes(r.status) ? Number(r.est_usd) : 0;
function hfRange() {
  if (hfPeriod === 'month') return [monthStart(0), null];
  if (hfPeriod === 'last') return [monthStart(-1), monthStart(0)];
  const n = {d7: 7, d30: 30, d90: 90}[hfPeriod]; return [new Date(Date.now() - n * 86400e3), null];
}
async function hfLoad() {
  const [from, to] = hfRange(), m0 = monthStart(0);
  const qOf = (a, b) => { let x = SB.from('pt_hf_gen').select('id,at,uid,name,team,purpose,model,model_path,kind,mode,prompt,params,est_usd,usd,status,error,files,saved_at,done_at').gte('at', a.toISOString()).order('at', {ascending: false}).limit(5000); return b ? x.lt('at', b.toISOString()) : x; };
  const [g, cur, lim, adm, can, rq] = await Promise.all([qOf(from, to), hfPeriod === 'month' ? null : qOf(m0, null), SB.from('pt_hf_limit').select('uid,name,grp,monthly_usd'), SB.rpc('pt_hf_admin'), SB.rpc('pt_ai_usage_can'),
    SB.from('pt_hf_limit_req').select('id,at,uid,name,add_usd,reason,limit_before,spent_before,status,decided_at').order('id', {ascending: false}).limit(30)]);
  const err = g.error || cur?.error || lim.error;
  if (err) { hfErr = err.message; if (hf) renderHf(); else $app.innerHTML = `<div class="gate"><h1>힉스필드 API 사용</h1><p>읽기 오류: ${esc(hfErr)}</p></div>`; return; }
  hfErr = '';
  hf = {rows: g.data || [], month: hfPeriod === 'month' ? (g.data || []) : (cur.data || []), limits: lim.data || [], admin: !!adm.data, all: !!can.data, reqs: rq?.data || [], at: new Date()};
  renderHf();
}
function group(rows, key) {
  const M = new Map();
  for (const r of rows) { const k = key(r) || '—', x = M.get(k) || {k, usd: 0, n: 0, img: 0, vid: 0, pend: 0};
    x.usd += hfCost(r); x.n++; r.kind === 'image' ? x.img++ : x.vid++; if (['queued', 'in_progress'].includes(r.status)) x.pend++; M.set(k, x); }
  return [...M.values()].sort((a, b) => b.usd - a.usd || b.n - a.n);
}
function hfBars(rows) {
  if (!rows.length) return '<p class="note">이 기간에 만든 것이 없습니다.</p>';
  const [from] = hfRange(), end = hfPeriod === 'last' ? monthStart(0) : new Date();
  const keyOf = d => { if (hfUnit === 'day') return d; const t = new Date(d + 'T00:00:00Z'); const dow = (t.getUTCDay() + 6) % 7; return new Date(t.getTime() - dow * 86400e3).toISOString().slice(0, 10); };
  const B = new Map();
  for (let t = new Date(kstDay(from) + 'T00:00:00Z'); t <= new Date(kstDay(end) + 'T00:00:00Z'); t = new Date(t.getTime() + 86400e3)) { const k = keyOf(t.toISOString().slice(0, 10)); if (!B.has(k)) B.set(k, {day: k, usd: 0, n: 0}); }
  for (const r of rows) { const k = keyOf(kstDay(r.at)), b = B.get(k) || {day: k, usd: 0, n: 0}; b.usd += hfCost(r); b.n++; B.set(k, b); }
  const pts = [...B.values()].sort((a, b) => a.day.localeCompare(b.day));
  const W = 600, H = 160, P = 4, max = Math.max(...pts.map(p => p.usd)) || 1, bw = (W - 2 * P) / pts.length;
  const bars = pts.map((p, i) => { const h = p.usd ? Math.max(2, (H - 2 * P) * p.usd / max) : 0, x = P + i * bw;
    return `<rect x="${(x + 1).toFixed(1)}" y="${(H - P - h).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)"/><rect x="${x.toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" fill="transparent" data-tip="${esc(p.day.slice(5).replace('-', '/'))}${hfUnit === 'week' ? ' 주' : ''} · ${usd(p.usd, 2)} · ${p.n}건"/>`; }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${hfUnit === 'day' ? '일별' : '주별'} 힉스필드 사용액">
    <line x1="${P}" x2="${W - P}" y1="${H - P}" y2="${H - P}" stroke="var(--rule)" vector-effect="non-scaling-stroke"/>${bars}</svg>
    <div class="axis"><span>${pts[0].day.slice(5).replace('-', '/')}</span><span>가장 많은 ${hfUnit === 'day' ? '날' : '주'} ${usd(max, 2)}</span><span>${pts.at(-1).day.slice(5).replace('-', '/')}</span></div></div>`;
}
function renderHf() {
  const R = hf.rows, monthBy = new Map();
  for (const r of hf.month) monthBy.set(r.uid, (monthBy.get(r.uid) || 0) + hfCost(r));
  const limOf = uid => { const l = hf.limits.find(x => x.uid === uid); return l ? {usd: Number(l.monthly_usd), grp: l.grp} : {usd: HF_DEF, grp: '기본'}; };
  // 사람: 기간 사용 + 한도 행(안 쓴 사람도)
  const P = new Map();
  for (const r of R) { const p = P.get(r.uid) || {uid: r.uid, name: r.name, team: r.team, usd: 0, n: 0, img: 0, vid: 0}; p.usd += hfCost(r); p.n++; r.kind === 'image' ? p.img++ : p.vid++; P.set(r.uid, p); }
  for (const l of hf.limits) if (!P.has(l.uid)) P.set(l.uid, {uid: l.uid, name: l.name, team: l.grp, usd: 0, n: 0, img: 0, vid: 0});
  const people = [...P.values()].map(p => ({...p, lim: limOf(p.uid), month: monthBy.get(p.uid) || 0})).sort((a, b) => b.usd - a.usd || b.month - a.month || a.name.localeCompare(b.name, 'ko'));
  const total = R.reduce((a, r) => a + hfCost(r), 0), pend = R.filter(r => ['queued', 'in_progress'].includes(r.status));
  const img = R.filter(r => r.kind === 'image').length, vid = R.length - img;
  const users = new Set(R.map(r => r.uid)).size, over = people.filter(p => p.month > SCALE_SEAT).length;
  const teams = group(R, r => r.team), purposes = group(R, r => r.purpose), models = group(R, r => r.model === 'custom' ? r.model_path : r.model), kinds = group(R, r => r.kind === 'image' ? '이미지' : '영상');
  const teamList = [...new Set(R.map(r => r.team))].sort((a, b) => a.localeCompare(b, 'ko'));
  const log = R.filter(r => (!hfTeam || r.team === hfTeam) && (!hfQ || [r.name, r.team, r.purpose, r.model, r.model_path, r.prompt].join(' ').toLowerCase().includes(hfQ)));
  const share = (x, t) => t ? Math.round(x / t * 100) : 0;
  const small = (title, sub, G) => `<section class="panel"><h2>${title} <small>${sub}</small></h2><div class="tw"><table><thead><tr><th>${title.replace('별', '')}</th><th class="r">사용액</th><th class="r">건수</th><th class="r hide-sm">비중</th></tr></thead><tbody>
    ${G.slice(0, 12).map(x => `<tr><td>${esc(x.k)}${x.pend ? ` <span class="chip warn">진행 ${x.pend}</span>` : ''}</td><td class="r num">${usd(x.usd, 2)}</td><td class="r num">${x.n}</td><td class="r num hide-sm">${share(x.usd, total)}%</td></tr>`).join('') || '<tr><td colspan="4" class="unk">없음</td></tr>'}
    ${G.length > 12 ? `<tr><td colspan="4" class="unk">그 밖 ${G.length - 12}개 · ${usd(G.slice(12).reduce((a, x) => a + x.usd, 0), 2)}</td></tr>` : ''}</tbody></table></div></section>`;
  const limCell = p => {
    const pct = p.lim.usd ? Math.min(100, p.month / p.lim.usd * 100) : 100, cls = pct >= 100 ? 'bad' : pct >= 80 ? 'warn' : '';
    const edit = hf.admin && hfEdit === p.uid ? `<span class="tools" style="margin-top:4px"><input id="limv" type="number" min="0" max="5000" step="10" value="${p.lim.usd}" style="flex:0 0 90px" aria-label="${esc(p.name)} 월 한도"><button class="pt-btn primary" data-lim-save="${p.uid}">저장</button><button class="pt-btn quiet" data-lim-cancel>취소</button></span>`
      : hf.admin ? ` <button class="pt-btn quiet" data-lim-edit="${p.uid}" style="height:22px;padding:0 6px;font-size:12px">한도 바꾸기</button>` : '';
    return `<div class="bar" title="이번 달 ${usd(p.month, 2)} / ${usd(p.lim.usd)}"><i style="width:${pct}%;${cls === 'bad' ? 'background:var(--negative)' : cls === 'warn' ? 'background:var(--warning)' : ''}"></i></div>
      <span class="sm">이번 달 ${usd(p.month, 2)} / ${usd(p.lim.usd)} · ${Math.round(pct)}%${p.lim.grp && p.lim.grp !== '기본' ? ` · ${esc(p.lim.grp)}` : ''}</span>${edit}`;
  };
  $app.innerHTML = `
  <header class="head">

// 사람 단위로 묶기: 이메일 → 이름·팀, 서비스 좌석, Claude 사용·활용
function people() {
  const P = new Map();
  const key = r => (r.name && r.team !== '구성원 명단에 없음' ? r.name + '|' + r.team : r.email);
  for (const r of rows.filter(r => r.kind === 'seat' || r.kind === 'activity')) {
    const k = key(r);
    const p = P.get(k) || {name: r.name || r.email, team: r.team || '구성원 명단에 없음', emails: new Set(), seats: [], monthly: 0, monthlyUnknown: false, used: null, act: {}};
    p.emails.add(r.email);
    if (r.data?.left) { p.left = true; p.leftSrc = r.data.left_src || ''; }
    if (r.kind === 'seat') {
      p.seats.push({svc: r.service, plan: r.plan, usd: r.monthly_usd, note: r.note});
      if (r.monthly_usd == null) p.monthlyUnknown = true; else p.monthly += Number(r.monthly_usd);
      if (r.service === 'claude' && r.used_usd != null) p.used = (p.used || 0) + Number(r.used_usd);
    } else Object.assign(p.act, r.data || {});
    P.set(k, p);
  }
  return [...P.values()];
}
const hasAct = p => Object.values(p.act).some(v => Number(v) > 0) || (p.used || 0) > 0;

function spark(points) {
  // 한 계열 막대(날짜별 추정 금액) — 마우스를 올리면 그날 값
  if (!points.length) return '<p class="note">기록이 없습니다.</p>';
  const W = 600, H = 160, P = 4, max = Math.max(...points.map(p => p.usd)) || 1, bw = (W - 2 * P) / points.length;
  const bars = points.map((p, i) => { const h = Math.max(1, (H - 2 * P) * p.usd / max), x = P + i * bw;
    return `<rect x="${(x + 1).toFixed(1)}" y="${(H - P - h).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="var(--accent)" data-tip="${esc(p.day.slice(5).replace('-', '/'))} · ${usd(p.usd, 2)}${p.tokens != null ? ` · ${tok(p.tokens)} 토큰` : ''}${p.calls != null ? ` · ${n0(p.calls)}회` : ''}"/>`; }).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="날짜별 Claude API 금액">
    <line x1="${P}" x2="${W - P}" y1="${H - P}" y2="${H - P}" stroke="var(--rule)" vector-effect="non-scaling-stroke"/>${bars}</svg>
    <div class="axis"><span>${points[0].day.slice(5).replace('-', '/')}</span><span>가장 높은 날 ${usd(max, 0)}</span><span>${points.at(-1).day.slice(5).replace('-', '/')}</span></div></div>`;
}

$app.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'hfcsv') return hfCsv();
  if (b.dataset.limEdit) { hfEdit = b.dataset.limEdit; renderHf(); document.getElementById('limv')?.focus(); return; }
  if (b.hasAttribute('data-lim-cancel')) { hfEdit = ''; renderHf(); return; }
  if (b.dataset.reqOk || b.dataset.reqNo) { const ok = !!b.dataset.reqOk; b.disabled = true; b.innerHTML = '<span class="spin" aria-hidden="true"></span>' + (ok ? '승인 중' : '거절 중');
    const { error } = await SB.rpc('pt_hf_limit_decide', {p_id: Number(b.dataset.reqOk || b.dataset.reqNo), p_ok: ok});
    if (error) { alert('처리하지 못했습니다: ' + error.message); b.disabled = false; b.textContent = ok ? '승인' : '거절'; return; }
    return hfLoad(); }
  if (b.dataset.limSave) { const v = Number(document.getElementById('limv').value); b.disabled = true; b.innerHTML = '<span class="spin" aria-hidden="true"></span>저장 중';
    const { error } = await SB.rpc('pt_hf_limit_set', {p_uid: b.dataset.limSave, p_usd: v});
    if (error) { alert('한도를 바꾸지 못했습니다: ' + error.message); b.disabled = false; b.textContent = '저장'; return; }
    hfEdit = ''; return hfLoad(); }
  if (b.dataset.open) { const w = window.open('', '_blank'); const old = b.innerHTML; b.disabled = true; b.innerHTML = '<span class="spin" aria-hidden="true"></span>여는 중';
    const { data, error } = await SB.storage.from('pt-hf').createSignedUrl(b.dataset.open, 3600);
    b.disabled = false; b.innerHTML = old;
    if (error || !data?.signedUrl) { w?.close(); alert('결과물을 열지 못했습니다: ' + (error?.message || '')); return; }
    if (w) w.location = data.signedUrl; else location.href = data.signedUrl; } });

async function load() {
  const r1 = await SB.from('pt_ai_usage_run').select('run_at,host,status,secs').order('run_at', {ascending: false}).limit(1);
  if (r1.error) { lastErr = r1.error.message; if (run) render(); else $app.innerHTML = `<div class="gate"><h1>AI 구독 현황</h1><p>읽기 오류: ${esc(lastErr)}</p></div>`; return; }
  if (!r1.data.length) { $app.innerHTML = `<div class="gate"><h1>AI 구독 현황</h1><p>이 화면을 볼 수 있는 권한이 없거나 아직 수집 기록이 없습니다.<br>필요하면 AX팀 김현우에게 요청해 주세요.</p><a class="pt-btn" href="../">이그드라실로 돌아가기</a></div>`; return false; }
  const latest = r1.data[0];
  const [r2, r3] = await Promise.all([
    SB.from('pt_ai_usage_snapshot').select('service,kind,email,name,team,company,plan,monthly_usd,used_usd,tokens,data,note').eq('run_at', latest.run_at).limit(2000),
    SB.from('pt_ai_usage_snapshot').select('run_at,used_usd').eq('service', 'claude').eq('kind', 'service').gte('run_at', new Date(Date.now() - 31 * 86400e3).toISOString()).order('run_at').limit(1000)]);
  if (r2.error) { lastErr = r2.error.message; if (run) render(); return; }
  lastErr = ''; run = latest; rows = r2.data || []; hist = r3.data || [];
  render(); return true;
}

let tab = location.hash === '#hf' ? 'hf' : 'sub';
function setTab() {
  document.getElementById('tab-sub').toggleAttribute('aria-current', tab === 'sub'); document.getElementById('tab-hf').toggleAttribute('aria-current', tab === 'hf');
  if (tab === 'sub') document.getElementById('tab-sub').setAttribute('aria-current', 'page'); else document.getElementById('tab-hf').setAttribute('aria-current', 'page');
  document.title = tab === 'hf' ? '힉스필드 API 사용' : 'AI 구독 현황';
}
const loadCur = () => tab === 'hf' ? hfLoad() : load();
window.addEventListener('hashchange', () => {
  const t = location.hash === '#hf' ? 'hf' : location.hash === '' || location.hash === '#' ? 'sub' : tab;
  if (t === tab) return; tab = t; setTab();
  $app.innerHTML = `<div class="gate"><h1>${tab === 'hf' ? '힉스필드 API 사용' : 'AI 구독 현황'}</h1><p><span class="spin" aria-hidden="true"></span>불러오는 중…</p></div>`; loadCur();
});
(async () => {
  setTab();
  const { data: { session } } = await SB.auth.getSession();
  if (!session) { $app.innerHTML = `<div class="gate"><h1>AI 구독 현황</h1><p>이그드라실(헤임달 계정·슬랙)로 로그인한 뒤 다시 열어 주세요.</p><a class="pt-btn" href="../">이그드라실에서 로그인</a></div>`; return; }
  await loadCur();
  setInterval(() => { if (!document.hidden && !hfEdit) loadCur(); }, POLL);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !hfEdit) loadCur(); });
})();
</script>
</body>
</html>
