<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>숏폼 A·B 시연</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 2026-11-11 다시 그림 — 「뭐가 보이지도 않고 직관적이지도 않다」(김현우)
   ① 결론부터(어느 쪽이 빠르고 싼지, 차이가 어디서 나는지) ② 숫자는 표 대신 A·B 막대에 값을 바로 적음
   ③ 프롬프트는 핵심 차이 세 줄, 원문은 접어 둠 ④ 결과는 「장면」 단위로 A·B 영상을 크게 나란히
   ⑤ 본문 16px · 대비 4.5:1 이상 · A=파랑 / B=주황 + 글자 표시(색만으로 구분하지 않음) */
:root{
  --bg:#F3F5F8;--surface:#FFFFFF;--sunken:#EBEFF4;--line:#D9DFE7;--line-soft:#E9EDF2;
  --ink:#0B1220;--ink-2:#253044;--ink-3:#4A5568;--ink-4:#6B7686;
  --a:#1D4ED8;--a-soft:#E6EDFD;--a-line:#B7C9F7;
  --b:#C2410C;--b-soft:#FDEEE5;--b-line:#F6C6A8;
  --win:#047857;--win-soft:#E3F6EE;
  --r:14px;--r-sm:10px;
  --shadow:0 1px 2px rgba(11,18,32,.05),0 1px 1px rgba(11,18,32,.03);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A0F18;--surface:#121A27;--sunken:#0E1520;--line:#263247;--line-soft:#1B2536;
  --ink:#F1F4F9;--ink-2:#D3DAE5;--ink-3:#A6B1C2;--ink-4:#8592A6;
  --a:#7FA6FF;--a-soft:#16264A;--a-line:#2D4580;--b:#FF9A62;--b-soft:#33200F;--b-line:#5C3A1A;--win:#5DD3A6;--win-soft:#0F2E24;
  --shadow:none;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6;word-break:keep-all;font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:2px;border-radius:6px}

/* 윗줄 */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1160px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;gap:24px}
.top b{font-size:16px;white-space:nowrap}
.top nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.top nav a{text-decoration:none;color:var(--ink-3);font-size:15px;font-weight:600;padding:8px 12px;border-radius:8px;white-space:nowrap;min-height:40px;display:flex;align-items:center}
.top nav a:hover{background:var(--sunken);color:var(--ink)}

.wrap{max-width:1160px;margin:0 auto;padding:40px 24px 80px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
h1{font-size:36px;line-height:1.25;margin:8px 0 12px;letter-spacing:-.025em}
h2{font-size:24px;line-height:1.3;margin:0 0 6px;letter-spacing:-.02em}
h3{font-size:18px;margin:0}
.sub{color:var(--ink-3);margin:0 0 20px;font-size:16px}
section{margin-top:64px}
.meta{color:var(--ink-4);font-size:14px}

/* A·B 표시 */
.ab{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;font-weight:800;font-size:14px;color:#fff;flex-shrink:0}
.ab.a{background:var(--a)} .ab.b{background:var(--b)}
@media (prefers-color-scheme:dark){.ab{color:#0A0F18}}

/* 결론 */
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:28px;margin-top:28px}
.verdict-h{font-size:22px;font-weight:800;line-height:1.45;letter-spacing:-.015em;margin:0}
.verdict-h em{font-style:normal;color:var(--win)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.fact{border:1px solid var(--line-soft);background:var(--bg);border-radius:var(--r-sm);padding:18px}
.fact .k{font-size:14px;color:var(--ink-3);font-weight:600}
.fact .v{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.2}
.fact .d{font-size:14px;color:var(--ink-2);margin-top:6px}
.win{display:inline-block;font-size:13px;font-weight:700;color:var(--win);background:var(--win-soft);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.scope{margin-top:20px;font-size:14px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px 18px}
.scope b{color:var(--ink)}

/* 막대 비교 */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.metric h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.metric h3 small{font-size:13px;color:var(--ink-4);font-weight:500}
.src-bars{margin-top:18px;display:grid;gap:18px}
.src-name{font-size:14px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.bar{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;margin-top:6px}
.track{height:14px;background:var(--sunken);border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px}
.fill.a{background:var(--a)} .fill.b{background:var(--b)}
.bar .val{font-size:15px;font-weight:700;min-width:76px;text-align:right}
.metric .total{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:14px;color:var(--ink-3)}
.metric .total b{color:var(--ink)}

/* 프롬프트 */
.prompts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.prompt{background:var(--surface);border:1px solid var(--line);border-top:4px solid;border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.prompt.a{border-top-color:var(--a)} .prompt.b{border-top-color:var(--b)}
.prompt h3{display:flex;align-items:center;gap:10px;font-size:20px}
.prompt .one{font-size:17px;font-weight:700;margin:14px 0 10px;color:var(--ink)}
.prompt ul{margin:0;padding-left:20px;color:var(--ink-2)}
.prompt li{margin:6px 0}
details{margin-top:16px}
summary{cursor:pointer;font-weight:700;color:var(--ink-3);font-size:15px;min-height:40px;display:flex;align-items:center;gap:6px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
pre{white-space:pre-wrap;word-break:keep-all;font-family:inherit;font-size:15px;line-height:1.65;color:var(--ink-2);background:var(--bg);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:16px;margin:8px 0 0}
.common{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 24px 20px}

/* 결과 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 24px}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:700;font-size:15px;padding:10px 18px;border-radius:999px;cursor:pointer;min-height:44px}
.tabs button[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.tabs button small{font-weight:500;opacity:.75;margin-left:6px}
.scene{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.scene-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:16px 24px;border-bottom:1px solid var(--line-soft);background:var(--bg)}
.scene-h h3{font-size:18px}
.scene-h .tag{font-size:14px;color:var(--ink-3)}
.scene-h .same{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--win-soft);color:var(--win)}
.scene-h .diff{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunken);color:var(--ink-3)}
.scene-b{display:grid;grid-template-columns:1fr 1fr}
.side{padding:24px;display:grid;grid-template-columns:200px 1fr;gap:20px;align-content:start}
.side + .side{border-left:1px solid var(--line-soft)}
.side.empty{display:flex;align-items:center;justify-content:center;color:var(--ink-4);font-size:15px;min-height:200px}
video{width:200px;aspect-ratio:9/16;border-radius:var(--r-sm);background:#000;object-fit:cover;display:block}
.who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--ink-3)}
.title{font-size:20px;font-weight:800;line-height:1.35;margin:10px 0 6px;letter-spacing:-.01em}
.when{font-size:14px;color:var(--ink-3)}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--a-soft);color:var(--a);margin-left:6px}
.lbl{font-size:13px;font-weight:700;color:var(--ink-4);margin-top:14px}
.txt{font-size:15px;color:var(--ink-2);margin-top:2px}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.nums span{font-size:14px;background:var(--bg);border:1px solid var(--line-soft);border-radius:8px;padding:4px 10px;color:var(--ink-3)}
.nums b{color:var(--ink)}

/* 방법·한계 */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.panel ul{margin:10px 0 0;padding-left:20px;color:var(--ink-2)}
.panel li{margin:8px 0}
footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);color:var(--ink-4);font-size:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{color:var(--ink-3)}

/* 로그인 */
.login{max-width:460px;margin:14vh auto 0;text-align:center;padding:0 24px}
.login .sub{margin:12px auto 28px}
.slack{font-weight:700;font-size:16px;color:#fff;background:#4A154B;border:0;border-radius:10px;padding:14px 28px;cursor:pointer;min-height:48px}
.slack:disabled{opacity:.6;cursor:default}
.err{color:#B42318;font-size:15px;margin-top:14px}
.loading{padding:30vh 0;text-align:center;color:var(--ink-3)}

@media (max-width:980px){
  .metrics,.facts{grid-template-columns:1fr}
  .prompts,.two{grid-template-columns:1fr}
  .scene-b{grid-template-columns:1fr}
  .side + .side{border-left:0;border-top:1px solid var(--line-soft)}
}
@media (max-width:560px){
  .wrap{padding:24px 16px 64px}
  .top-in{padding:0 16px;gap:12px}
  .top nav a{padding:8px}
  h1{font-size:28px}
  .verdict{padding:20px}
  .verdict-h{font-size:19px}
  .fact .v{font-size:23px}
  .top b{display:none}
  .side{grid-template-columns:120px 1fr;padding:18px;gap:14px}
  video{width:120px}
  .title{font-size:17px}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
// 🔴 2026-11-11 김현우 「비공개로, 슬랙 로그인 붙여서 우리 회사 사람만」 — 판테온과 같은 헤임달 계정(슬랙 OIDC)으로 로그인하고,
//    헤임달 승인 구성원(pt_can_use)만 비공개 보관함 shorts-ab 의 기록(data.json)·영상을 읽습니다. 이 페이지 파일에는 자료가 없습니다.
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";
const SB = createClient("https://dwoiobqucmikbtikfjwk.supabase.co", "sb_publishable_K6BW26u2jRkTBDwuMqaaFA_3HkfnOc9");
const 함 = "shorts-ab";
const 로컬 = ["localhost", "127.0.0.1"].includes(location.hostname);   // 작업자 PC 미리보기 — out/ 폴더를 그대로 읽음
let D = null, 주소 = {};
const 앱 = () => document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const 분초 = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}`;
const 걸림 = (s) => s >= 60 ? `${Math.floor(s / 60)}분 ${Math.round(s % 60)}초` : `${Math.round(s)}초`;
const 수 = (n) => Number(n).toLocaleString("ko-KR");
const 퍼센트 = (작은, 큰) => Math.round((1 - 작은 / 큰) * 100);
const 채널 = { youtube: "유튜브 쇼츠", instagram: "인스타 릴스", tiktok: "틱톡" };

const 슬랙로그인 = () => SB.auth.signInWithOAuth({ provider: "slack_oidc", options: { redirectTo: location.origin + location.pathname } });
function 로그인화면(말) {
  앱().innerHTML = `<div class="login"><div class="eyebrow">THE ALMIGHTY · AX팀</div><h1>숏폼 A·B 시연</h1>
    <p class="sub">더올마이티 임직원만 볼 수 있는 내부 보고 페이지입니다.<br>회사 슬랙 계정으로 로그인해 주세요. 헤임달에서 승인된 계정만 들어올 수 있습니다.</p>
    <button class="slack" id="slack">슬랙으로 로그인</button>${말 ? `<p class="err" role="alert">${esc(말)}</p>` : ""}</div>`;
  document.getElementById("slack").onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = "슬랙으로 이동하는 중…";
    sessionStorage.setItem("ab_slack", "1");
    const { error } = await 슬랙로그인();
    if (error) { sessionStorage.removeItem("ab_slack"); 로그인화면("슬랙으로 로그인하지 못했습니다. 잠시 후 다시 시도해 주세요."); }
  };
}
async function 시작() {
  if (로컬) { D = await (await fetch("data.json")).json(); 그리기(); return; }
  const 오류 = new URLSearchParams(location.hash.slice(1)).get("error_description") || new URLSearchParams(location.search).get("error_description");
  const { data: { session } } = await SB.auth.getSession();
  if (!session) return 로그인화면(오류 ? "슬랙 로그인이 취소되었거나 실패했습니다." : "");
  const 단계 = sessionStorage.getItem("ab_slack");
  if (단계) {   // 슬랙 이메일이 헤임달 로그인 이메일과 다른 직원 — 판테온과 같은 연결 절차
    sessionStorage.removeItem("ab_slack");
    const { data: r } = await SB.rpc("hd_slack_link");
    if (r === "linked" && 단계 === "1") { await SB.auth.signOut({ scope: "local" }); sessionStorage.setItem("ab_slack", "2"); return 슬랙로그인(); }
    const 실패 = { linked: "슬랙 계정을 연결하지 못했습니다. 관리자에게 문의해 주세요.", other_team: "더올마이티 슬랙 계정으로만 로그인할 수 있습니다.", ambiguous: "이 슬랙 이메일과 연결된 헤임달 계정이 두 개 이상입니다. 관리자에게 문의해 주세요.", new: "헤임달에 가입되지 않은 계정입니다. 헤임달 가입·승인 후 다시 로그인해 주세요." }[r];
    if (실패) { await SB.auth.signOut({ scope: "local" }); return 로그인화면(실패); }
  }
  const { data: 됨 } = await SB.rpc("pt_can_use");
  if (!됨) { await SB.auth.signOut({ scope: "local" }); return 로그인화면("헤임달에서 아직 승인되지 않은 계정입니다. 승인 후 다시 로그인해 주세요."); }
  if (location.hash.includes("access_token")) try { history.replaceState(null, "", location.pathname); } catch {}
  앱().innerHTML = `<p class="loading">기록을 불러오는 중…</p>`;
  const { data: 파일, error } = await SB.storage.from(함).download("data.json");
  if (error) { 앱().innerHTML = `<p class="loading err">기록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p>`; return; }
  D = JSON.parse(await 파일.text());
  const 경로들 = D.원본.flatMap((x) => [...x.A.편, ...x.B.편]).flatMap((c) => [c.영상, c.표지]);
  const { data: 서명 } = await SB.storage.from(함).createSignedUrls(경로들, 6 * 3600);
  for (const s of 서명 ?? []) if (s.signedUrl) 주소[s.path] = s.signedUrl;
  그리기();
}
const 경로 = (p) => 로컬 ? p : (주소[p] ?? "");

/** A 편마다 겹치는 구간이 가장 긴 B 편을 짝으로(겹친 비율도) */
function 짝짓기(A, B) {
  const 남은 = [...B], 줄 = [];
  for (const a of A) {
    let 고른 = -1, 최대 = 0;
    남은.forEach((b, i) => { const 겹 = Math.min(a.끝, b.끝) - Math.max(a.시작, b.시작); if (겹 > 최대) { 최대 = 겹; 고른 = i; } });
    const b = 고른 >= 0 ? 남은.splice(고른, 1)[0] : null;
    줄.push([a, b, b ? 최대 / Math.max(a.끝 - a.시작, b.끝 - b.시작) : 0]);
  }
  for (const b of 남은) 줄.push([null, b, 0]);
  return 줄.sort((x, y) => (x[0] ?? x[1]).시작 - (y[0] ?? y[1]).시작);
}

function 쪽(c, k) {
  if (!c) return `<div class="side empty">${k}는 이 장면을 고르지 않았습니다</div>`;
  return `<div class="side">
    <video src="${esc(경로(c.영상))}" poster="${esc(경로(c.표지))}" controls preload="none" playsinline controlslist="nodownload" aria-label="프롬프트 ${k} 결과 영상"></video>
    <div>
      <div class="who"><span class="ab ${k.toLowerCase()}">${k}</span>프롬프트 ${k}${c.채널 ? `<span class="chip">${esc(채널[c.채널] ?? c.채널)}용</span>` : ""}</div>
      <div class="title">${c.제목.map(esc).join("<br>")}</div>
      <div class="when">원본 ${분초(c.시작)}–${분초(c.끝)} · ${Math.round(c.끝 - c.시작)}초짜리 숏폼</div>
      <div class="lbl">왜 이 장면인가</div><div class="txt">${esc(c.이유)}</div>
      ${c.채널규칙 ? `<div class="lbl">맞춘 채널 규칙</div><div class="txt">${esc(c.채널규칙)}</div>` : ""}
      ${c.참여 ? `<div class="lbl">반응을 노린 지점</div><div class="txt">${esc(c.참여)}</div>` : ""}
      <details><summary>캡션 보기</summary><div class="txt">${esc(c.캡션)}</div></details>
      <div class="nums"><span>편집 <b>${걸림(c.걸린초)}</b></span><span>토큰 <b>${수(c.토큰.입력 + c.토큰.출력)}</b></span><span><b>${수(c.원)}원</b></span></div>
    </div></div>`;
}

let 고른원본 = 0;
function 그리기() {
  const 원본 = D.원본;
  const 합 = (k) => 원본.reduce((t, x) => ({ 초: t.초 + x[k].합.초, 토큰: t.토큰 + x[k].합.입력 + x[k].합.출력, 원: t.원 + x[k].합.원, 편: t.편 + x[k].합.편수 }), { 초: 0, 토큰: 0, 원: 0, 편: 0 });
  const A = 합("A"), B = 합("B");
  const 쌍 = 원본.flatMap((x) => 짝짓기(x.A.편, x.B.편));
  const 같은 = 쌍.filter(([a, b, r]) => a && b && r >= 0.6).length, 전체쌍 = 쌍.length;
  const 영상분 = Math.round(원본.reduce((t, x) => t + x.길이, 0) / 60);
  const 빠른 = B.초 <= A.초 ? "B" : "A", 싼 = B.원 <= A.원 ? "B" : "A";
  const 시간차 = 퍼센트(Math.min(A.초, B.초), Math.max(A.초, B.초)), 비용차 = 퍼센트(Math.min(A.원, B.원), Math.max(A.원, B.원));
  const 만든때 = new Date(D.만든때).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });

  const 막대 = (제목, 단위설명, 값, 표시) => {
    const 최대 = Math.max(...원본.flatMap((x) => [값(x.A.합), 값(x.B.합)]));
    return `<div class="metric"><h3>${제목}<small>${단위설명}</small></h3><div class="src-bars">
      ${원본.map((x) => `<div><div class="src-name">${esc(x.제목.replace(/^사운드스루 인터뷰 /, ""))} <span class="meta">· ${esc(x.팀)} · 원본 ${Math.round(x.길이 / 60)}분</span></div>
        ${["A", "B"].map((k) => `<div class="bar"><span class="ab ${k.toLowerCase()}">${k}</span><div class="track" role="img" aria-label="프롬프트 ${k} ${표시(값(x[k].합))}"><div class="fill ${k.toLowerCase()}" style="width:${(값(x[k].합) / 최대 * 100).toFixed(1)}%"></div></div><span class="val">${표시(값(x[k].합))}</span></div>`).join("")}
      </div>`).join("")}</div>
      <div class="total">합계 · A <b>${표시(값({ 초: A.초, 입력: A.토큰, 출력: 0, 원: A.원 }))}</b> · B <b>${표시(값({ 초: B.초, 입력: B.토큰, 출력: 0, 원: B.원 }))}</b></div></div>`;
  };

  앱().innerHTML = `
  <header class="top"><div class="top-in"><b>숏폼 A·B 시연</b><nav aria-label="바로 가기">
    <a href="#결론">결론</a><a href="#숫자">시간·비용</a><a href="#프롬프트">프롬프트</a><a href="#결과">결과 영상</a><a href="#방법">측정 방법</a></nav></div></header>
  <main class="wrap">
    <div class="eyebrow">THE ALMIGHTY · AX팀 · 숏폼 자동 편집</div>
    <h1>같은 영상, 다른 지시 — 프롬프트 A·B 비교</h1>
    <p class="sub">롱폼 원본 하나를 두 가지 지시로 각각 자동 편집해 결과와 시간·비용을 나란히 놓았습니다. 자막 글꼴·로고 같은 디자인은 두 쪽이 똑같습니다.</p>
    <div class="meta">기록 기준 ${만든때} · 작성 AX팀 김현우 · 모든 숫자는 편집 작업자가 남긴 실측값</div>

    <div class="verdict" id="결론">
      <p class="verdict-h">고른 장면은 <em>${전체쌍}쌍 중 ${같은}쌍이 같았고</em>, 차이는 <em>제목·캡션의 말투</em>에서 났습니다.
        시간·비용은 ${빠른 === 싼 ? `프롬프트 ${빠른}가 조금 덜 들었지만` : "거의 같아"} 원본 하나당 몇십 초·몇십 원 차이입니다.</p>

        <div class="fact"><div class="k">API 사용료 (합계)</div><div class="v">A ${수(A.원)}원 · B ${수(B.원)}원</div><div class="d">프롬프트 ${싼}가 ${비용차}% 쌈 · 숏폼 한 편당 약 ${Math.round((A.원 + B.원) / (A.편 + B.편))}원<span class="win">${싼}</span></div></div>
      </div>
      <div class="scope"><span>원본 <b>${원본.length}개</b> (합계 ${영상분}분)</span><span>만든 숏폼 <b>${A.편 + B.편}편</b> (A ${A.편} · B ${B.편})</span><span>토큰 합계 <b>${수(A.토큰 + B.토큰)}</b></span><span>팀 <b>${[...new Set(원본.map((x) => x.팀))].join(" · ")}</b></span></div>
    </div>

    <section id="숫자">
      <h2>시간·토큰·비용 — 원본별 A·B</h2>
      <p class="sub">막대가 짧을수록 덜 든 쪽입니다. 값은 막대 끝에 적었습니다.</p>
      <div class="metrics">
        ${막대("편집까지 걸린 시간", "받아쓰기+구간 고르기+편집", (s) => s.초, 걸림)}
        ${막대("토큰", "Claude 입력+출력", (s) => s.입력 + s.출력, 수)}
        ${막대("API 사용료", "원 (1달러=1,450원)", (s) => s.원, (v) => `${수(v)}원`)}
      </div>
    </section>

    <section id="프롬프트">
      <h2>두 프롬프트 — 무엇이 다른가</h2>
      <p class="sub">공통 지시(첫 3초 궁금증 · 문장 중간에서 자르지 않기 · 제목 14자 이내 등)는 같고, 아래 부분만 다릅니다.</p>
      <div class="prompts">
        <div class="prompt a"><h3><span class="ab a">A</span>채널 규칙형</h3>
          <div class="one">「채널마다 규칙이 다르니, 채널을 정하고 그 규칙에 맞춰라」</div>
          <ul><li>유튜브 쇼츠 · 인스타 릴스 · 틱톡의 특성(길이, 잘리는 곳, 추천 신호)을 먼저 정리</li><li>숏폼마다 맞출 채널을 하나 정함 — 채널마다 1편씩</li><li>길이·제목·해시태그를 그 채널 관습대로</li></ul>
          <details><summary>원문 보기</summary><pre>${esc(D.프롬프트.A.머리)}\n\n${esc(D.프롬프트.A.길이)}</pre></details></div>
        <div class="prompt b"><h3><span class="ab b">B</span>후킹·완시·참여형</h3>
          <div class="one">「채널은 신경 쓰지 말고, 멈추게·끝까지 보게·반응하게 하라」</div>
          <ul><li>첫 1~3초에 손가락을 멈추게(후킹)</li><li>끝까지 보게(완시) — 늘어지는 부분은 뺌</li><li>끝은 댓글을 부르는 물음·반전·여운으로(참여)</li></ul>
          <details><summary>원문 보기</summary><pre>${esc(D.프롬프트.B.머리)}\n\n${esc(D.프롬프트.B.길이)}</pre></details></div>
      </div>
      <div class="common"><details><summary>A·B 모두에 들어가는 공통 지시 보기</summary><pre>${esc(D.프롬프트.공통)}</pre></details></div>
    </section>

    <section id="결과">
      <h2>결과 영상 — 같은 장면끼리 나란히</h2>
      <p class="sub">원본을 고르면 그 원본에서 나온 A·B 숏폼을 장면별로 보여 줍니다.</p>
      <div class="tabs" role="tablist" aria-label="원본 고르기">${원본.map((x, i) => `<button role="tab" aria-selected="${i === 고른원본}" data-i="${i}">${esc(x.제목.replace(/^사운드스루 인터뷰 /, ""))}<small>${esc(x.팀)} · ${Math.round(x.길이 / 60)}분</small></button>`).join("")}</div>
      <div id="장면들">${짝짓기(원본[고른원본].A.편, 원본[고른원본].B.편).map(([a, b, r], i) => `<article class="scene">
        <div class="scene-h"><h3>장면 ${i + 1}</h3><span class="tag">원본 ${분초((a ?? b).시작)}–${분초((a ?? b).끝)}</span>${a && b ? (r >= 0.6 ? `<span class="same">A·B 같은 장면</span>` : `<span class="diff">일부만 겹침</span>`) : `<span class="diff">한쪽만 고름</span>`}</div>
        <div class="scene-b">${쪽(a, "A")}${쪽(b, "B")}</div></article>`).join("")}</div>
    </section>

    <section id="방법">
      <div class="two">
        <div class="panel"><h2>어떻게 쟀나</h2><ul>
          <li><b>편집까지 걸린 시간</b> — 받아쓰기(사무실 서버 PC 그래픽카드) + 구간 고르기(Claude) + 세로 편집·자막. 받아쓰기·구간 고르기는 원본 한 번이라 편 수로 나눠 각 편에 얹었습니다. 드라이브에서 받는 시간과 대기 순서는 빼고 쟀습니다.</li>
          <li><b>토큰</b> — Claude 응답에 실려 오는 입력·출력 토큰 수를 그대로 더했습니다.</li>
          <li><b>API 사용료</b> — 토큰 × 작업자에 설정한 단가(${esc(원본[0]?.A.편[0]?.모델 ?? "")}, 100만 토큰당 입력 $4 · 출력 $20), 1달러 1,450원. 받아쓰기는 자체 PC라 0원.</li>
        </ul></div>
        <div class="panel"><h2>아직 확인 못 한 것</h2><ul>
          <li>SNS 반응(조회·저장·댓글)으로 A·B를 비교하지 못했습니다. 출연자가 연예인이라 초상권·소속사 협의 전에는 외부에 올리지 않기로 했습니다.</li>
          <li>제목·캡션의 곡 이름·해시태그(예: 공원 A 「#이리저리」)는 사람이 원자료와 대조하지 않았습니다.</li>
          <li>골포스트·맛출장 원본은 받는 중(기한 11/13)입니다. 들어오면 이 페이지에 팀별로 더합니다.</li>
          <li>영상은 페이지용으로 다시 압축해 실제 결과물보다 화질이 낮습니다.</li>
        </ul></div>
      </div>
    </section>

    <footer><span>THE ALMIGHTY · AX팀 — 임직원 전용 내부 보고 페이지입니다. 영상을 내려받거나 외부에 공유하지 말아 주세요.</span>${로컬 ? "" : `<a href="#" id="logout">로그아웃</a>`}</footer>
  </main>`;

  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => { 고른원본 = Number(b.dataset.i); const y = scrollY; 그리기(); scrollTo(0, y); }));
  document.getElementById("logout")?.addEventListener("click", async (e) => { e.preventDefault(); await SB.auth.signOut({ scope: "local" }); location.reload(); });
}
시작();
</script>
</body>
