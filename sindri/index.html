<!-- 신드리 Sindri — AI 생성 (11-24 김현우 「이그드라실에 붙이지 말고 판테온 지도에 하나 추가」 · 이름 신드리 = 묠니르를 만든 난쟁이 대장장이)
     처음 만든 날 (2026-11-24 · 김현우 「힉스필드 화면을 우리 규칙으로 · API 로 쓸 수 있는 모델만 · 모델 목록 매일 자동 갱신 · 내가 만든 것은 아카이브로」)
     원본 pantheon/web/sindri/index.html → 배포 thealmightycorp/pantheon sindri/ (빌드 없이 복사 · 옛 주소 studio/ 는 여기로 넘김)
     모델·입력 칸: pt_hf_model(봇이 매일 힉스필드 문서에서 갱신, 회사 키로 견적이 나오는 것만) → 스키마대로 칸을 그림
     만들기: 커넥터 ygg-mcp 의 hf_generate_preview → confirm (견적·한도·용도 필수·결과 보관은 커넥터가) · 진행은 hf_status
     아카이브: pt_hf_gen(본인 것) · 파일은 저장소 pt-hf/<uid>/<id>/ · 사진 올리기는 pt-hf/<uid>/uploads/
     처음엔 김현우만(pt_hf_admin) — 대표님 보고 뒤 넓힘
     남은 한도: 오른쪽 위 · 한도 추가 요청 pt_hf_limit_request → 봇이 김현우 DM → 현황판 힉스필드 탭에서 승인(pt_hf_limit_decide) -->

<style>
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--ground);color:var(--text);font:var(--fs-body)/1.5 var(--font);-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.pt-column.wide{max-width:1400px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.left{display:grid;grid-template-columns:auto auto;align-items:center;gap:2px 10px;min-width:220px;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:8px 14px;font:inherit;color:inherit;cursor:pointer;text-align:left}
.left:hover{border-color:var(--control)}.left:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.left .lt{font-size:12px;color:var(--muted)}.left b{font-size:20px;font-weight:700;justify-self:end}
.left .bar{grid-column:1/-1}.left .lt:last-child{grid-column:1/-1}
.left.warn b{color:var(--warning-ink)}.left.bad b{color:var(--negative-ink)}
.bar{height:6px;border-radius:99px;background:var(--active);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.warn i{background:var(--warning)}.bar.bad i{background:var(--negative)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--active);flex-wrap:wrap}
.seg button{border:0;background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg.sub button{font-size:13px;padding:6px 12px}
.bar-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.work{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border-radius:var(--radius-card);padding:16px;display:grid;gap:14px;min-width:0}
.panel.sticky{position:sticky;top:16px;max-height:calc(100svh - 32px);overflow-y:auto}
.f{display:grid;gap:6px}
.f>label,.f>.lab{font-size:12px;font-weight:600;color:var(--muted)}
.f>label em,.f>.lab em{color:var(--negative);font-style:normal;margin-left:2px}
.f .hint{font-size:12px;color:var(--faint)}
select,input[type=text],input[type=number],textarea{width:100%;border:1px solid var(--control);border-radius:10px;background:var(--raised);color:var(--text);font:inherit;font-size:14px;padding:9px 12px}
textarea{resize:vertical;min-height:110px;line-height:1.5}
select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--control);background:var(--raised);color:var(--text);font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--text);color:var(--ground);border-color:var(--text)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.model{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;border:1px solid var(--control);border-radius:12px;padding:10px 12px;background:var(--raised);cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.model b{font-size:15px}.model small{grid-column:1/-1;color:var(--muted);font-size:12px}
.model .chev{color:var(--muted)}
.mlist{display:grid;gap:6px;max-height:360px;overflow-y:auto}
.mlist button{display:grid;gap:2px;text-align:left;border:1px solid transparent;border-radius:10px;padding:8px 10px;background:transparent;font:inherit;color:inherit;cursor:pointer}
.mlist button:hover{background:var(--raised)}
.mlist button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-pale)}
.mlist button small{color:var(--muted);font-size:12px}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--active);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.slot img,.slot video{width:100%;height:100%;object-fit:cover}
.slot .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer;line-height:22px;padding:0}
.addslot{display:flex;gap:6px;flex-wrap:wrap}
details.adv summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
details.adv[open] summary{margin-bottom:10px}
details.adv>div{display:grid;gap:12px}
.q{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;margin-left:5px;border-radius:50%;border:1px solid var(--control);background:var(--raised);color:var(--muted);font:600 11px/1 var(--font);cursor:help;padding:0;vertical-align:1px}
.q:hover,.q:focus-visible{color:var(--text);border-color:var(--text);outline:none}
.q .pop{display:none;position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--text);color:var(--ground);font:400 12px/1.5 var(--font);text-align:left;white-space:normal;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:auto}
.q:hover .pop,.q:focus .pop,.q:focus-within .pop{display:block}
.panel .q .pop{left:0;transform:none}
.go{display:grid;gap:8px;position:sticky;bottom:-16px;background:var(--surface);padding:12px 0 2px;border-top:1px solid var(--rule)}
.go .pt-btn{height:44px;font-size:15px;font-weight:600}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}.indet i{animation-duration:4s !important}}
.err{border-radius:10px;padding:10px 12px;background:var(--negative-pale);color:var(--negative-ink);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{position:relative;border-radius:14px;overflow:hidden;background:var(--active);aspect-ratio:1/1;cursor:pointer;border:0;padding:0;font:inherit;color:inherit;display:block;width:100%}
.card img,.card video{width:100%;height:100%;object-fit:cover;display:block}
.card .tag{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:var(--pill-neutral-bg);color:var(--pill-neutral-ink);font-size:11px;font-weight:600;white-space:nowrap}
.card .chip{background:rgba(0,0,0,.55);color:#fff}
.chip.bad{background:var(--negative-pale);color:var(--negative-ink)}
.card .wait{position:absolute;inset:0;display:grid;place-content:center;gap:8px;text-align:center;padding:16px;color:var(--muted);font-size:13px;background:var(--raised)}
.card .wait b{color:var(--text);font-size:14px}
.indet{height:4px;width:140px;border-radius:99px;background:var(--active);overflow:hidden;margin:0 auto}.indet i{display:block;width:40%;height:100%;background:var(--accent);border-radius:99px;animation:slide 1.4s ease-in-out infinite}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{padding:48px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--radius-card)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input{flex:1 1 220px;min-width:0}.tools select{width:auto}
.dlg{position:fixed;inset:0;z-index:30;background:rgba(10,12,16,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;width:min(460px,100%);max-height:calc(100svh - 32px);overflow-y:auto;padding:20px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet h2{margin:0;font-size:18px}
.sheet .price{font-size:32px;font-weight:700}
.sheet .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.sheet .row b{color:var(--text);font-weight:600;text-align:right}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end}
.sheet .acts .pt-btn{height:40px}
.viewer{width:min(1180px,100%);display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;padding:0;overflow:hidden}
.viewer .media{background:#0d0f13;display:grid;place-items:center;min-height:320px;max-height:calc(100svh - 32px)}
.viewer .media img,.viewer .media video{max-width:100%;max-height:calc(100svh - 32px);display:block}
.viewer .info{padding:18px;display:grid;gap:12px;align-content:start;overflow-y:auto;max-height:calc(100svh - 32px)}
.viewer .info p{margin:0;font-size:14px;white-space:pre-wrap}
.viewer .info .k{font-size:12px;color:var(--muted);font-weight:600}
.viewer .acts{display:grid;gap:8px}
.pick{width:min(760px,100%)}
.pick .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.gate{max-width:440px;margin:12vh auto;padding:28px;background:var(--surface);border-radius:var(--radius-card);display:grid;gap:12px;text-align:center}
.gate h1{font:600 22px/1.3 var(--serif);margin:0}.gate p{margin:0;color:var(--muted)}
@media (max-width:1000px){.work{grid-template-columns:minmax(0,1fr)}.panel.sticky{position:static;max-height:none}.viewer{grid-template-columns:minmax(0,1fr)}.viewer .info{max-height:none}}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

async function mcp(name, args) {
  const { data: { session } } = await SB.auth.getSession();
  const r = await fetch(MCP, {method: 'POST', headers: {Authorization: 'Bearer ' + session.access_token, 'Content-Type': 'application/json'},
    body: JSON.stringify({jsonrpc: '2.0', id: Date.now(), method: 'tools/call', params: {name, arguments: args}})});
  const j = await r.json().catch(() => ({}));
  const text = (j.result?.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
  if (!r.ok || j.error || j.result?.isError) throw new Error(text || j.error?.message || '서버에 연결하지 못했습니다. 잠시 뒤 다시 해 주세요.');
  return j.result.structuredContent || {};
}

async function loadModels() {
  const { data, error } = await SB.from('pt_hf_model').select('path,kind,family,family_title,family_desc,workflow,title,schema,sort,price_note').eq('available', true).is('removed_at', null).order('sort');
  if (error) throw error;
  models = (data || []).map(m => ({...m, wfk: wfOf(m)}));

async function loadGens() {
  const { data, error } = await SB.from('pt_hf_gen').select('id,at,model,model_path,kind,mode,prompt,purpose,params,est_usd,usd,status,error,files,saved_at').eq('uid', me.id).order('id', {ascending: false}).limit(500);
  if (error) throw error;
  gens = data || [];
  const need = gens.flatMap(g => (g.files || []).map(f => f.path)).filter(p => !urls[p]);
  for (let i = 0; i < need.length; i += 100) {
    const { data: su } = await SB.storage.from('pt-hf').createSignedUrls(need.slice(i, i + 100), 3600 * 6);
    (su || []).forEach((x, k) => { if (x.signedUrl) urls[need[i + k]] = x.signedUrl; });
  }
  const m0 = new Date(Date.now() + 9 * 3600e3); const start = Date.UTC(m0.getUTCFullYear(), m0.getUTCMonth(), 1) - 9 * 3600e3;
  limit.spent = gens.filter(g => new Date(g.at).getTime() >= start).reduce((a, g) => a + (g.status === 'completed' ? Number(g.usd) : ['queued', 'in_progress'].includes(g.status) ? Number(g.est_usd) : 0), 0);
  const open = gens.filter(g => ['queued', 'in_progress'].includes(g.status) || (g.status === 'completed' && !g.saved_at));
  clearTimeout(poll);
  if (open.length) poll = setTimeout(async () => { await Promise.all(open.slice(0, 3).map(g => mcp('hf_status', {gen_id: g.id}).catch(() => {}))); await loadGens(); render(); }, 5000);
}

  const head = `<header class="head"><div><h1 class="pt-title" style="margin:0">신드리</h1><p>회사 힉스필드 계정으로 이미지·영상을 만듭니다. 만든 것은 내 아카이브에 계속 남습니다.</p></div>${usageHtml()}</header>

    ${kind !== 'archive' ? `<div class="seg sub" role="group" aria-label="작업">${WF.filter(([k]) => models.some(m => m.kind === kind && m.wfk === k)).map(([k, v]) => `<button type="button" data-wf="${k}" aria-pressed="${wf === k}">${v}</button>`).join('')}</div><button type="button" class="q" aria-label="${esc((WF.find(x => x[0] === wf) || [, ''])[1])} 설명"><span aria-hidden="true">?</span><span class="pop" role="tooltip">${esc(WF_TIP[wf] || '')}</span></button>` : ''}</div>`;
  if (kind === 'archive') {
    const xs = gens.filter(g => (!akind || g.kind === akind) && (!aq || [g.purpose, g.prompt, g.model].join(' ').toLowerCase().includes(aq)));
    $app.innerHTML = head + `<div class="tools"><input type="search" id="aq" placeholder="용도·프롬프트·모델 찾기" value="${esc(aq)}" aria-label="아카이브 찾기"><select id="ak" aria-label="종류 고르기"><option value="">전체</option><option value="image" ${akind === 'image' ? 'selected' : ''}>이미지</option><option value="video" ${akind === 'video' ? 'selected' : ''}>영상</option></select></div>
      ${xs.length ? `<div class="grid">${xs.map(cardHtml).join('')}</div>` : `<div class="empty">${gens.length ? '찾는 것이 없습니다.' : '아직 만든 것이 없습니다. 이미지나 비디오에서 만들어 보세요.'}</div>`}`;
    return;
  }
  const mine = gens.filter(g => g.kind === kind).slice(0, 60);
  const fams = famsFor();
  $app.innerHTML = head + `<div class="work">
    <section class="panel sticky" aria-label="설정">
      <div class="f"><span class="lab">모델</span>
        <button class="model" type="button" id="mbtn" aria-expanded="${showList}"><b>${esc(sel ? sel.family_title : '없음')}</b><span class="chev">${showList ? '▴' : '▾'}</span><small>${esc(sel ? wfName(sel) : '')} · 모델 ${fams.length}개 중 고르기</small></button>
        ${showList ? `<div class="mlist" role="group" aria-label="모델 목록">${fams.map(m => `<button type="button" data-model="${esc(m.path)}" aria-pressed="${sel && sel.path === m.path}"><b>${esc(m.family_title)}</b><small>${esc(wfName(m))}</small></button>`).join('')}</div>` : ''}
      </div>
      ${formHtml()}
      <div class="f"><label for="fpur">용도${tip('purpose')}<em aria-hidden="true">*</em></label><input id="fpur" type="text" value="${esc(purpose)}" placeholder="어느 프로젝트·제안서에 쓰는지 (예: 골포스트 × 리락쿠마 제안서)"></div>
      ${err ? `<div class="err" role="alert">${esc(err)}${/한도/.test(err) && !reqs.some(r => r.status === 'wait') ? ` <button class="pt-btn" type="button" id="errlim" style="margin-top:8px">한도 추가 요청</button>` : ''}</div>` : ''}
      <div class="go"><button class="pt-btn accent" type="button" id="make" ${busy || !sel ? 'disabled' : ''}>${busy ? '<span class="spin" aria-hidden="true"></span> 예상 비용 확인 중' : '만들기'}</button></div>
    </section>
    <section aria-label="내가 만든 ${kind === 'image' ? '이미지' : '영상'}">
      ${mine.length ? `<div class="grid">${mine.map(cardHtml).join('')}</div>` : `<div class="empty">왼쪽에서 프롬프트를 쓰고 「만들기」를 눌러 주세요.<br>만든 ${kind === 'image' ? '이미지' : '영상'}가 여기에 쌓입니다.</div>`}
    </section></div>`;
}

// ── 만들기
function collect() {
  const P = sel.schema?.properties || {}, fields = {};
  for (const [k, v] of Object.entries(form)) if (P[k] && v !== '' && v != null) fields[k] = v;
  const m = {}; for (const [k, list] of Object.entries(media)) if (list.length) m[k] = list.map(x => x.gen ? {gen: x.gen} : {upload: x.upload});
  return {fields, media: m};
}
async function make() {
  err = '';
  purpose = (document.getElementById('fpur')?.value || '').trim();
  if (purpose.length < 2) { err = '용도를 넣어 주세요. 어느 프로젝트·제안서에 쓰는지 적으면 됩니다.'; render(); document.getElementById('fpur')?.focus(); return; }
  ls.set('purpose', purpose); if (form.prompt) ls.set('prompt', form.prompt);
  const { fields, media: med } = collect();
  busy = true; render();
  try {
    const d = await mcp('hf_generate_preview', {model_path: sel.path, purpose, prompt: fields.prompt, fields, media: med, via: 'web'});
    busy = false; render(); confirmSheet(d);
  } catch (e) { busy = false; err = e.message; render(); }
}
function confirmSheet(d) {
  const pct = d.limit ? Math.min(100, d.after / d.limit * 100) : 0;
  $dlg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cft">
    <h2 id="cft">이대로 만들까요?</h2>
    <div><div class="price num">${usd(d.est)}</div><div class="hint" style="font-size:12px;color:var(--muted)">힉스필드 예상 비용 · 실패하거나 내용 검사에서 거절되면 청구되지 않습니다</div></div>
    <div class="row"><span>모델</span><b>${esc(sel.family_title + ' · ' + wfName(sel))}</b></div>
    <div class="row"><span>용도</span><b>${esc(purpose)}</b></div>
    ${(() => { const { fields, media: md } = collect(); const xs = Object.entries(fields).filter(([k]) => k !== 'prompt').map(([k, v]) => `${lab(k)} ${v === true ? '켬' : v === false ? '끔' : v}`).concat(Object.entries(md).map(([k, l]) => `${lab(k)} ${l.length}개`));
      return xs.length ? `<div class="row"><span>설정</span><b>${esc(xs.join(' · '))}</b></div>` : ''; })()}
    <div class="f"><div class="row"><span>이번 달 사용</span><b class="num">${usd(d.spent)} → ${usd(d.after)} / ${usd(d.limit)}</b></div><div class="bar ${pct >= 100 ? 'bad' : pct >= 80 ? 'warn' : ''}"><i style="width:${pct}%"></i></div></div>
    ${d.note && /token/i.test(d.note) ? `<p class="hint" style="margin:0;font-size:12px;color:var(--muted)">이 모델은 쓴 만큼 나중에 정산되어, 실제 금액은 보통 이보다 적습니다.</p>` : ''}
    <div class="err" id="cerr" hidden></div>
    <div class="acts"><button class="pt-btn quiet" type="button" data-close>취소</button><button class="pt-btn accent" type="button" id="cgo">${usd(d.est)}로 만들기</button></div></div>`;
  $dlg.hidden = false; document.getElementById('cgo').focus();
  document.getElementById('cgo').onclick = async e => {
    const b = e.currentTarget; b.disabled = true; b.innerHTML = '<span class="spin" aria-hidden="true"></span> 요청하는 중';
    try { await mcp('confirm', {draft_id: d.draft_id}); closeDlg(false); await loadGens(); render(); }
    catch (x) { const c = document.getElementById('cerr'); c.textContent = x.message; c.hidden = false; b.disabled = false; b.textContent = `${usd(d.est)}로 만들기`; }
  };
  $dlg.querySelector('[data-close]').onclick = () => closeDlg(true);
}
function closeDlg(cancel) { $dlg.hidden = true; $dlg.innerHTML = ''; }

// ── 보기
function viewer(id) {
  const g = gens.find(x => x.id === id); if (!g) return;
  const files = g.files || [], P = g.params || {};
  const sets = Object.entries(P).filter(([k, v]) => !['workflow', 'media', 'images', 'from_gen', 'uploads'].includes(k) && v !== '' && v != null && typeof v !== 'object').map(([k, v]) => `${lab(k)} ${v === true ? '켬' : v === false ? '끔' : v}`).join(' · ');
  const big = files.map(f => urls[f.path] ? ((f.type || '').startsWith('video/') ? `<video src="${esc(urls[f.path])}" controls playsinline autoplay muted loop></video>` : `<img src="${esc(urls[f.path])}" alt="">`) : '').join('');
  const st = {queued: '차례 기다리는 중', in_progress: '만드는 중', completed: '완료', failed: '만들지 못함(청구 안 됨)', nsfw: '내용 검사에서 거절됨(청구 안 됨)', canceled: '취소됨', error: '오류'}[g.status] || g.status;
  const img = files.find(f => (f.type || '').startsWith('image/'));
  $dlg.innerHTML = `<div class="sheet viewer" role="dialog" aria-modal="true" aria-label="생성 결과 보기">
    <div class="media">${big || `<div class="wait" style="color:#aab">${esc(st)}</div>`}</div>
    <div class="info">
      <div><span class="k">프롬프트</span><p>${esc(g.prompt || '—')}</p></div>
      <div><span class="k">용도</span><p>${esc(g.purpose)}</p></div>
      <div><span class="k">모델</span><p>${esc(g.model)}${sets ? `\n${esc(sets)}` : ''}</p></div>
      <div><span class="k">상태 · 비용</span><p>${esc(st)} · ${usd(g.status === 'completed' ? g.usd : ['queued', 'in_progress'].includes(g.status) ? g.est_usd : 0)} · ${kst(g.at)}</p></div>
      ${g.error && g.status !== 'completed' ? `<div class="err">${esc(g.error)}</div>` : ''}
      <div class="acts">
        ${files.length && urls[files[0].path] ? files.map((f, i) => `<a class="pt-btn accent" href="${esc(urls[f.path])}" download="ai_${g.id}_${i + 1}">다운로드${files.length > 1 ? ' ' + (i + 1) : ''}</a>`).join('') : ''}
        ${img ? `<button class="pt-btn" type="button" data-tovideo="${g.id}">이 이미지로 영상 만들기</button>` : ''}
        <button class="pt-btn" type="button" data-again="${g.id}">같은 설정으로 다시 만들기</button>
        <button class="pt-btn" type="button" data-copy="${g.id}">프롬프트 복사</button>
        <button class="pt-btn quiet" type="button" data-close>닫기</button>
      </div></div></div>`;
  $dlg.hidden = false;
}
function picker(k) {
  const mk = mediaKind(k), xs = gens.filter(g => g.status === 'completed' && (g.files || []).some(f => (f.type || '').startsWith(mk) && urls[f.path]));
  $dlg.innerHTML = `<div class="sheet pick" role="dialog" aria-modal="true" aria-labelledby="pkt"><h2 id="pkt">아카이브에서 ${mk === 'video' ? '영상' : mk === 'audio' ? '음성' : '사진'} 고르기</h2>
    ${xs.length ? `<div class="grid">${xs.map(g => { const f = g.files.find(f => (f.type || '').startsWith(mk)); return `<button class="card" type="button" data-pickgen="${g.id}" data-k="${k}" aria-label="${esc(g.purpose)}">${mk === 'video' ? `<video src="${esc(urls[f.path])}#t=0.1" muted preload="metadata"></video>` : `<img src="${esc(urls[f.path])}" alt="" loading="lazy">`}</button>`; }).join('')}</div>` : '<div class="empty">아카이브에 고를 것이 없습니다.</div>'}
    <div class="acts"><button class="pt-btn quiet" type="button" data-close>닫기</button></div></div>`;
  $dlg.hidden = false;
}
let upKey = '';
$file.addEventListener('change', async () => {
  const files = [...$file.files]; $file.value = ''; if (!files.length || !upKey) return;
  const k = upKey, P = sel.schema?.properties?.[k] || {}, max = P.type === 'array' ? (P.maxItems || 16) : 1;
  err = '';
  for (const f of files.slice(0, max - (media[k] || []).length)) {
    if (f.size > 45 * 1024 * 1024) { err = `${f.name}: 45MB 보다 큰 파일은 올릴 수 없습니다.`; continue; }
    const path = `${me.id}/uploads/${Date.now()}_${f.name.replace(/[^A-Za-z0-9._-]/g, '_').slice(-60)}`;
    const item = {upload: path, preview: URL.createObjectURL(f), loading: true};
    (media[k] = media[k] || []).push(item); render();
    const { error } = await SB.storage.from('pt-hf').upload(path, f, {contentType: f.type || undefined});
    if (error) { media[k] = media[k].filter(x => x !== item); err = '올리지 못했습니다: ' + error.message; }
    else item.loading = false;
  }
  render();
});

// ── 이벤트
$app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.kind) { kind = b.dataset.kind; ls.set('kind', kind); showList = false; if (kind !== 'archive') pickDefault(); render(); return; }
  if (b.dataset.wf) { wf = b.dataset.wf; ls.set('wf', wf); showList = false; pickDefault(); render(); return; }
  if (b.id === 'mbtn') { showList = !showList; render(); return; }
  if (b.id === 'limbtn' || b.id === 'errlim') { limitSheet(); return; }
  if (b.dataset.model) { sel = models.find(m => m.path === b.dataset.model); ls.set('model.' + kind + '.' + wf, sel.path); const keepP = form.prompt; resetForm(); if (keepP) form.prompt = keepP; showList = false; render(); return; }
  if (b.dataset.k && b.dataset.v !== undefined) { const p = sel.schema.properties[b.dataset.k]; const v = p.type === 'integer' || p.type === 'number' ? Number(b.dataset.v) : b.dataset.v; form[b.dataset.k] = v; render(); return; }
  if (b.dataset.up) { upKey = b.dataset.up; const mk = mediaKind(upKey); $file.accept = mk + '/*'; $file.multiple = (sel.schema.properties[upKey] || {}).type === 'array'; $file.click(); return; }
  if (b.dataset.arc) { picker(b.dataset.arc); return; }
  if (b.dataset.rm) { media[b.dataset.rm].splice(Number(b.dataset.i), 1); render(); return; }
  if (b.id === 'make') { make(); return; }
  if (b.dataset.open) { viewer(Number(b.dataset.open)); return; }
});
$app.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'aq') { aq = t.value.trim().toLowerCase(); const pos = t.selectionStart; render(); const el = document.getElementById('aq'); el.focus(); el.setSelectionRange(pos, pos); return; }
  if (t.id === 'fpur') { purpose = t.value; return; }
  if (t.dataset.k) { form[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.dataset.num ? (t.value === '' ? '' : Number(t.value)) : t.value; }
});
$app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ak') { akind = t.value; render(); return; }
  if (t.dataset.k) { form[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.dataset.num ? (t.value === '' ? '' : Number(t.value)) : t.value; }
});
$dlg.addEventListener('click', async e => {
  if (e.target === $dlg) return closeDlg(true);
  const b = e.target.closest('button'); if (!b) return;
  if (b.hasAttribute('data-close')) return closeDlg(true);
  if (b.dataset.amt) { reqAmt = Number(b.dataset.amt); document.getElementById('lamt').value = reqAmt; $dlg.querySelectorAll('[data-amt]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); return; }
  if (b.id === 'lsend' || b.id === 'lcancel') {
    const e2 = document.getElementById('lerr'), old = b.innerHTML; b.disabled = true; b.innerHTML = '<span class="spin" aria-hidden="true"></span> 보내는 중';
    const { error } = b.id === 'lsend' ? await SB.rpc('pt_hf_limit_request', {p_usd: Number(document.getElementById('lamt').value), p_reason: document.getElementById('lwhy').value})
      : await SB.rpc('pt_hf_limit_cancel', {p_id: Number(b.dataset.id)});
    if (error) { e2.textContent = error.message; e2.hidden = false; b.disabled = false; b.innerHTML = old; return; }
    await loadReqs(); closeDlg(); render(); return;
  }
  if (b.dataset.pickgen) { const k = b.dataset.k; (media[k] = media[k] || []).push({gen: Number(b.dataset.pickgen)}); closeDlg(); render(); return; }
  if (b.dataset.copy) { const g = gens.find(x => x.id === Number(b.dataset.copy)); try { await navigator.clipboard.writeText(g.prompt || ''); b.textContent = '복사했습니다'; } catch { b.textContent = '복사하지 못했습니다'; } return; }
  if (b.dataset.again) {
    const g = gens.find(x => x.id === Number(b.dataset.again)), m = models.find(x => x.path === g.model_path);
    if (!m) { b.textContent = '이 모델은 지금 쓸 수 없습니다'; return; }
    kind = m.kind; wf = m.wfk; sel = m; resetForm(); form.prompt = g.prompt; for (const [k, v] of Object.entries(g.params || {})) if (sel.schema.properties?.[k] && !isUrl(k, sel.schema.properties[k])) form[k] = v;
    purpose = g.purpose; closeDlg(); render(); window.scrollTo({top: 0, behavior: 'smooth'}); return;
  }
  if (b.dataset.tovideo) {
    const g = gens.find(x => x.id === Number(b.dataset.tovideo));
    kind = 'video'; wf = 'image'; ls.set('kind', kind); pickDefault();
    const P = sel?.schema?.properties || {}, k = ['image_url', 'first_frame_url', 'image_urls'].find(x => P[x]);
    if (k) media[k] = [{gen: g.id}];
    form.prompt = ''; purpose = g.purpose; closeDlg(); render(); window.scrollTo({top: 0, behavior: 'smooth'}); return;
  }
});
// 설명 상자는 화면 기준으로 띄움 (설정 칸이 스크롤 상자라 안에 두면 잘림)
function placeTip(q) {
  const pop = q?.querySelector('.pop'); if (!pop) return;
  const r = q.getBoundingClientRect(), w = Math.min(260, innerWidth - 24);
  pop.style.position = 'fixed'; pop.style.transform = 'none'; pop.style.maxWidth = w + 'px';
  pop.style.left = Math.max(12, Math.min(r.left - 8, innerWidth - w - 12)) + 'px';
  pop.style.top = (r.bottom + 8) + 'px'; pop.style.bottom = 'auto';
  requestAnimationFrame(() => { const h = pop.offsetHeight; if (r.bottom + 8 + h > innerHeight - 8) pop.style.top = Math.max(8, r.top - 8 - h) + 'px'; });
}
document.addEventListener('pointerover', e => { const q = e.target.closest?.('.q'); if (q) placeTip(q); });
document.addEventListener('focusin', e => { const q = e.target.closest?.('.q'); if (q) placeTip(q); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$dlg.hidden) closeDlg(true); });

(async () => {
  const { data: { session } } = await SB.auth.getSession();
  if (!session) { addEventListener('focus', async () => { const { data: { session: s2 } } = await SB.auth.getSession(); if (s2) location.reload(); }); $app.innerHTML = `<div class="gate"><h1>신드리</h1><p>판테온 계정(헤임달 계정·슬랙)으로 로그인해 주세요. 새 탭에서 로그인을 마치고 돌아오면 이 화면이 저절로 열립니다.</p><a class="pt-btn accent" href="../" target="_blank" rel="noopener">로그인</a></div>`; return; }
  me = session.user;
  SB.rpc('pt_ai_usage_can').then(({ data }) => { if (data) document.getElementById('nav-usage').hidden = false; });
  const { data: ok } = await SB.rpc('pt_hf_admin');
  if (!ok) { $app.innerHTML = `<div class="gate"><h1>신드리</h1><p>아직 열리지 않은 화면입니다. 지금은 Claude 에서 「이그드라실·궁니르」 커넥터로 힉스필드 이미지·영상을 만들 수 있습니다.</p><a class="pt-btn" href="https://pantheon-map.vercel.app">판테온 지도로 돌아가기</a></div>`; return; }
  try {
    const [, lm] = await Promise.all([loadModels(), mcp('hf_models', {}).catch(() => ({}))]);
    limit.limit = Number(lm.limit) || 0;
    await Promise.all([loadGens(), loadReqs()]);
  } catch (e) { $app.innerHTML = `<div class="gate"><h1>신드리</h1><p>불러오지 못했습니다: ${esc(e.message)}</p></div>`; return; }
  if (!models.length) { $app.innerHTML = `<div class="gate"><h1>신드리</h1><p><span class="spin" aria-hidden="true"></span> 쓸 수 있는 모델 목록을 준비하는 중입니다. 잠시 뒤 새로고침해 주세요.</p></div>`; return; }
  if (kind !== 'archive') pickDefault();
  render();
  setInterval(async () => { if (!document.hidden && $dlg.hidden) { const lm = await mcp('hf_models', {}).catch(() => null); if (lm?.limit != null) limit.limit = Number(lm.limit); await Promise.all([loadGens(), loadReqs()]).catch(() => {}); render(); } }, 60000);
})();
</script>
