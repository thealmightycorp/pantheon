<!-- 신드리 Sindri — AI 생성 (11-24 김현우 「이그드라실에 붙이지 말고 판테온 지도에 하나 추가」 · 이름 신드리 = 묠니르를 만든 난쟁이 대장장이)
     처음 만든 날 (2026-11-24 · 김현우 「힉스필드 화면을 우리 규칙으로 · API 로 쓸 수 있는 모델만 · 모델 목록 매일 자동 갱신 · 내가 만든 것은 아카이브로」)
     원본 pantheon/web/sindri/index.html → 배포 thealmightycorp/pantheon sindri/ (빌드 없이 복사 · 옛 주소 studio/ 는 여기로 넘김)
     모델·입력 칸: pt_hf_model(봇이 매일 힉스필드 문서에서 갱신, 회사 키로 견적이 나오는 것만) → 스키마대로 칸을 그림
     만들기: 커넥터 ygg-mcp 의 hf_generate_preview → confirm (견적·한도·용도 필수·결과 보관은 커넥터가) · 진행은 hf_status
     아카이브: pt_hf_gen(본인 것) · 파일은 저장소 pt-hf/<uid>/<id>/ · 사진 올리기는 pt-hf/<uid>/uploads/
     처음엔 김현우만(pt_hf_admin) — 대표님 보고 뒤 넓힘
     남은 한도: 오른쪽 위 · 한도 추가 요청 pt_hf_limit_request → 봇이 김현우 DM → 현황판 힉스필드 탭에서 승인(pt_hf_limit_decide) -->
<style>
/* 신드리 — 대장간: 흑연 모루 바탕 · 달군 황동 한 가지 · 결과물이 주인공 · 아래 떠 있는 프롬프트 독 */
:root{
  --anvil:#16171C; --iron:#1F2128; --slag:#2A2D36; --seam:#363A45; --bone:#ECE8E1; --ash:#9AA0AE; --cinder:#6B7180;
  --brass:#E3A73B; --brass-hot:#F2BD5C; --brass-ink:#1A1408;
  /* 대화 상자·안내가 쓰는 공용 이름을 대장간 색으로 */
  --ground:var(--anvil); --surface:var(--iron); --raised:var(--slag); --text:var(--bone); --muted:var(--ash); --faint:var(--cinder);
  --border:var(--seam); --control:var(--seam); --rule:var(--seam); --active:var(--slag);
  --accent:var(--brass); --accent-pale:rgba(227,167,59,.14); --accent-ink:var(--brass-hot);
  --negative:#E5685C; --negative-pale:rgba(229,104,92,.14); --negative-ink:#F3A097; --warning:#E3A73B; --warning-ink:#F2BD5C;
  --pill-neutral-bg:var(--slag); --pill-neutral-ink:var(--bone);
  --r-dock:22px; --r-tile:14px; --r-ctl:10px;
  --font:"Pretendard Variable",Pretendard,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--anvil);color:var(--bone);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:var(--brass-hot)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* 틀: 왼쪽 아이콘 줄 + 작업실 */
.shell{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:100svh}
.rail{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0;border-right:1px solid var(--seam);background:var(--anvil);z-index:6}
.mark{width:46px;height:46px;display:block;margin-bottom:14px;border-radius:13px;box-shadow:0 6px 18px rgba(227,167,59,.22),0 0 0 1px rgba(255,231,168,.18) inset;transition:transform .15s,box-shadow .15s}
.mark svg{width:100%;height:100%;display:block}
.mark:hover{transform:translateY(-1px) rotate(-3deg);box-shadow:0 10px 24px rgba(227,167,59,.32)}
@media (prefers-reduced-motion:reduce){.mark{transition:none}.mark:hover{transform:none}}
.rb{width:60px;display:grid;justify-items:center;gap:4px;padding:9px 0 7px;border-radius:12px;border:0;background:transparent;color:var(--ash);font-size:11px;font-weight:600;cursor:pointer;text-decoration:none}
.rb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rb:hover{color:var(--bone);background:var(--iron)}
.rb[aria-current=page],.rb[aria-pressed=true]{color:var(--brass-hot);background:var(--accent-pale)}
.rail .gap{flex:1}
.work{min-width:0;position:relative;padding:18px 28px 240px}

/* 위쪽 줄: 작업 갈래 · 남은 한도 */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0 8px 0 0;font-size:22px;font-weight:800;letter-spacing:-.03em}
.modes{display:flex;gap:4px;flex-wrap:wrap}
.modes button{border:1px solid transparent;background:transparent;color:var(--ash);font-size:14px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer}
.modes button:hover{color:var(--bone)}
.modes button[aria-pressed=true]{color:var(--bone);border-color:var(--seam);background:var(--iron)}
.top .sp{flex:1}
.left{display:flex;align-items:center;gap:10px;border:1px solid var(--seam);background:var(--iron);border-radius:999px;padding:6px 14px 6px 8px;cursor:pointer}
.left:hover{border-color:#4A4F5C}
.left .ring{--p:0;width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--brass) calc(var(--p)*1%),var(--slag) 0);display:grid;place-items:center}
.left .ring::after{content:"";width:20px;height:20px;border-radius:50%;background:var(--iron)}
.left.bad .ring{background:conic-gradient(var(--negative) calc(var(--p)*1%),var(--slag) 0)}
.left span{font-size:12px;color:var(--ash);line-height:1.2}
.left b{display:block;font-size:15px;color:var(--bone)}
.left.bad b{color:var(--negative-ink)}

/* 갤러리 — 원래 비율 그대로 쌓기 */
.wall{column-width:250px;column-gap:10px}
.tile{display:block;width:100%;break-inside:avoid;margin:0 0 10px;position:relative;border:0;padding:0;border-radius:var(--r-tile);overflow:hidden;background:var(--iron);cursor:zoom-in}
.tile img,.tile video{display:block;width:100%;height:auto}
.tile video{background:#000;object-fit:cover}
.tile .tag b{color:var(--brass-hot);margin-right:3px;font-size:9px}
.tile .cap{position:absolute;inset:auto 0 0 0;padding:28px 12px 10px;background:linear-gradient(transparent,rgba(10,10,12,.86));text-align:left;opacity:0;transition:opacity .15s}
.tile:hover .cap,.tile:focus-visible .cap{opacity:1}
.tile .cap b{display:block;font-size:13px;font-weight:600}
.tile .cap span{display:block;font-size:12px;color:var(--ash);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .kind{position:absolute;top:8px;left:8px;display:flex;gap:4px}
.tag{height:20px;padding:0 7px;border-radius:6px;background:rgba(10,10,12,.62);color:var(--bone);font-size:11px;font-weight:600;display:inline-flex;align-items:center;backdrop-filter:blur(6px)}
/* 만드는 중 — 달군 쇠 불씨 (이 화면의 유일한 저절로 움직이는 것) */
.tile.forging{cursor:default;display:grid;place-content:center;gap:8px;text-align:center;color:var(--ash);font-size:13px;background:var(--iron)}
.tile.forging::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 110%,rgba(227,167,59,.42),transparent 70%);animation:ember 2.4s ease-in-out infinite}
.tile.forging b{position:relative;color:var(--bone);font-size:14px}
.tile.forging span{position:relative}
.steps{position:relative;list-style:none;margin:0 auto 6px;padding:0;display:flex;align-items:flex-start;gap:0}
.steps li{display:grid;justify-items:center;gap:5px;width:58px;position:relative;font-size:11px;color:var(--cinder)}
.steps li+li::before{content:"";position:absolute;top:5px;right:calc(50% + 9px);width:40px;height:2px;border-radius:2px;background:var(--seam)}
.steps li.done+li::before,.steps li.done+li.now::before{background:var(--brass)}
.steps i{width:12px;height:12px;border-radius:50%;border:2px solid var(--seam);background:var(--iron)}
.steps li.done i{background:var(--brass);border-color:var(--brass)}
.steps li.done{color:var(--ash)}
.steps li.now i{border-color:var(--brass-hot);background:var(--brass-hot);box-shadow:0 0 0 4px rgba(242,189,92,.18);animation:beat 1.6s ease-in-out infinite}
.steps li.now{color:var(--bone);font-weight:600}
@keyframes beat{0%,100%{box-shadow:0 0 0 3px rgba(242,189,92,.16)}50%{box-shadow:0 0 0 7px rgba(242,189,92,.06)}}
@media (prefers-reduced-motion:reduce){.steps li.now i{animation:none}}
@keyframes ember{0%,100%{opacity:.45;transform:translateY(6%)}50%{opacity:1;transform:translateY(0)}}
.tile.failed{cursor:pointer;display:grid;place-content:center;text-align:center;padding:18px;color:var(--ash);font-size:13px;aspect-ratio:1}
.tile.failed b{color:var(--negative-ink)}
.blank{max-width:560px;margin:12vh auto 0;text-align:center}
.blank h2{margin:0 0 6px;font-size:30px;font-weight:800;letter-spacing:-.03em}
.blank p{margin:0 0 18px;color:var(--ash)}
.ex{display:grid;gap:8px}
.ex button{border:1px solid var(--seam);background:var(--iron);border-radius:12px;padding:11px 14px;text-align:left;color:var(--bone);font-size:14px;cursor:pointer}
.ex button:hover{border-color:var(--brass)}
.find{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.find input,.find select{height:38px;border:1px solid var(--seam);border-radius:var(--r-ctl);background:var(--iron);color:var(--bone);padding:0 12px;font:inherit;font-size:14px}
.find input{flex:1 1 240px;min-width:0}

/* 프롬프트 독 — 이 화면의 주인공 */
.dockwrap{position:fixed;left:76px;right:0;bottom:18px;display:flex;justify-content:center;padding:0 24px;z-index:8;pointer-events:none}
.dock{pointer-events:auto;position:relative;width:min(980px,100%);background:rgba(31,33,40,.92);backdrop-filter:blur(18px);border:1px solid var(--seam);border-radius:var(--r-dock);box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.02) inset;padding:12px}
.dock-main{display:flex;gap:10px;align-items:flex-start}
.dock textarea{flex:1;min-height:52px;max-height:200px;resize:none;border:0;background:transparent;color:var(--bone);font:inherit;font-size:16px;line-height:1.5;padding:6px 8px;outline:none}
.dock textarea::placeholder{color:var(--cinder)}
.slots{display:flex;gap:6px;flex-wrap:wrap;max-width:46%}
.slotgrp{display:flex;gap:4px;align-items:center}
.slot{position:relative;width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--slag);display:grid;place-items:center;color:var(--ash);font-size:11px;flex:none}
.slot img,.slot video{width:100%;height:100%;object-fit:cover}
.slot .x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:11px;line-height:18px;padding:0;cursor:pointer}
.slot.add{border:1px dashed #4A4F5C;background:transparent;cursor:pointer;text-align:center;line-height:1.2;padding:2px}
.slot.add:hover{border-color:var(--brass);color:var(--bone)}
.slot.add.need{border-color:var(--brass)}
.dock-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding-top:10px;border-top:1px solid var(--seam)}
.chip{height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:999px;border:1px solid var(--seam);background:var(--slag);color:var(--bone);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip small{color:var(--ash);font-weight:500;font-size:12px}
.chip:hover,.chip[aria-expanded=true]{border-color:#555B68;background:#30333D}
.chip.model{background:transparent}
.chip.model b{color:var(--brass-hot);font-weight:700}
.purpose{height:34px;flex:1 1 200px;min-width:150px;border:1px solid var(--seam);border-radius:999px;background:transparent;color:var(--bone);padding:0 14px;font:inherit;font-size:13px}
.purpose::placeholder{color:var(--cinder)}
.purpose.need{border-color:var(--brass)}
.forge{height:44px;min-width:132px;margin-left:auto;border:0;border-radius:14px;background:linear-gradient(180deg,var(--brass-hot),var(--brass));color:var(--brass-ink);font-size:15px;font-weight:800;letter-spacing:-.01em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;box-shadow:0 6px 18px rgba(227,167,59,.25)}
.forge:hover{filter:brightness(1.06)}
.forge:disabled{opacity:.55;cursor:default;filter:none}
.dock .err{margin-top:8px}
/* 칩을 누르면 위로 열리는 고르개 */
.pop-panel{position:absolute;left:12px;bottom:calc(100% + 10px);width:min(420px,calc(100vw - 48px));max-height:min(60vh,520px);overflow-y:auto;background:var(--iron);border:1px solid var(--seam);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.5);padding:14px;display:grid;gap:12px}
.pop-panel h3{margin:0;font-size:13px;color:var(--ash);font-weight:600}
.mfind{height:36px;border:1px solid var(--seam);border-radius:var(--r-ctl);background:var(--slag);color:var(--bone);padding:0 12px;font:inherit;font-size:14px;width:100%}
.mlist{display:grid;gap:2px}
.mlist button{display:grid;grid-template-columns:1fr auto;gap:0 8px;text-align:left;border:0;border-radius:10px;padding:8px 10px;background:transparent;cursor:pointer}
.mlist button:hover{background:var(--slag)}
.mlist button[aria-pressed=true]{background:var(--accent-pale)}
.mlist button[aria-pressed=true] b{color:var(--brass-hot)}
.mlist b{font-size:14px}.mlist small{grid-column:1;color:var(--ash);font-size:12px}
.mlist i{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;color:var(--cinder);font-size:12px}

/* 칸 — 고르개 안 · 대화 상자 */
.f{display:grid;gap:6px}
.f>label,.f>.lab{font-size:12px;font-weight:600;color:var(--ash)}
.f>label em,.f>.lab em{color:var(--brass-hot);font-style:normal;margin-left:2px}
.hint{font-size:12px;color:var(--cinder)}
select,input[type=text],input[type=number],input[type=email],input[type=password],textarea{width:100%;border:1px solid var(--seam);border-radius:var(--r-ctl);background:var(--slag);color:var(--bone);font:inherit;font-size:14px;padding:9px 12px}
.pop-panel textarea,.sheet textarea{resize:vertical;min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--seam);background:var(--slag);color:var(--bone);font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--bone);color:var(--anvil);border-color:var(--bone)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.toggle input{width:18px;height:18px;accent-color:var(--brass)}
.q{position:relative;display:inline-grid;place-items:center;width:17px;height:17px;margin-left:5px;border-radius:50%;border:1px solid #4A4F5C;background:transparent;color:var(--ash);font:600 10px/1 var(--font);cursor:help;padding:0;vertical-align:1px}
.q:hover,.q:focus-visible{color:var(--bone);border-color:var(--bone);outline:none}
.q .pop{display:none;position:fixed;width:max-content;max-width:260px;padding:9px 11px;border-radius:10px;background:var(--bone);color:var(--anvil);font:400 12px/1.5 var(--font);text-align:left;white-space:normal;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.q:hover .pop,.q:focus .pop,.q:focus-within .pop{display:block}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{border-radius:10px;padding:9px 12px;background:var(--negative-pale);color:var(--negative-ink);font-size:13px}
.bar{height:6px;border-radius:99px;background:var(--slag);overflow:hidden}.bar i{display:block;height:100%;background:var(--brass);border-radius:99px}
.bar.bad i{background:var(--negative)}

/* 대화 상자 */
.dlg{position:fixed;inset:0;z-index:50;background:rgba(6,7,9,.7);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.sheet{background:var(--iron);border:1px solid var(--seam);border-radius:20px;width:min(460px,100%);max-height:calc(100svh - 32px);overflow-y:auto;padding:22px;display:grid;gap:14px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.sheet h2{margin:0;font-size:18px;font-weight:700}
.sheet .price{font-size:36px;font-weight:800;letter-spacing:-.03em;color:var(--brass-hot)}
.sheet .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ash)}
.sheet .row b{color:var(--bone);font-weight:600;text-align:right}
.sheet .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn{height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;border-radius:12px;border:1px solid var(--seam);background:var(--slag);color:var(--bone);font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:#30333D}
.btn.quiet{background:transparent;border-color:transparent;color:var(--ash)}
.btn.hot{border:0;background:linear-gradient(180deg,var(--brass-hot),var(--brass));color:var(--brass-ink);font-weight:800}
.viewer{width:min(1240px,100%);display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0;padding:0;overflow:hidden}
.viewer .media{background:#0C0D10;display:grid;place-items:center;min-height:320px;max-height:calc(100svh - 32px)}
.viewer .media img,.viewer .media video{max-width:100%;max-height:calc(100svh - 32px);display:block}
.viewer .info{padding:20px;display:grid;gap:14px;align-content:start;overflow-y:auto;max-height:calc(100svh - 32px);border-left:1px solid var(--seam)}
.viewer .info p{margin:0;font-size:14px;white-space:pre-wrap}
.viewer .info .k{font-size:12px;color:var(--ash);font-weight:600}
.viewer .acts{display:grid;gap:8px}
.pick{width:min(820px,100%)}
.pick .wall{column-width:150px}
.gate{max-width:440px;margin:18vh auto;padding:28px;background:var(--iron);border:1px solid var(--seam);border-radius:20px;display:grid;gap:12px;text-align:center}
.login{max-width:380px;margin:14vh auto;text-align:left;gap:14px;padding:30px}
.login h1{text-align:center}.login>p{text-align:center;margin-top:-6px}
.login-mark{display:block;width:64px;height:64px;margin:0 auto 2px;border-radius:18px;box-shadow:0 10px 30px rgba(227,167,59,.28)}
.login-mark svg{width:100%;height:100%;display:block}
.login .slack{width:100%;height:46px;background:var(--bone);color:#1A1D21;border:0;font-weight:700;gap:10px}
.login .slack:hover{background:#fff}
.login .or{display:flex;align-items:center;gap:10px;color:var(--cinder);font-size:12px}.login .or::before,.login .or::after{content:"";flex:1;height:1px;background:var(--seam)}
.login .forge{width:100%;margin:0}
.login .hint{text-align:center;color:var(--ash)}
.boot{min-height:70vh;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center}
.boot b{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.boot-step{color:var(--ash);font-size:14px;min-height:21px}
.boot-bar{width:220px;height:4px;border-radius:99px;background:var(--slag);overflow:hidden;margin-top:6px}
.boot-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brass),var(--brass-hot));transition:width .45s ease}
.forge-anim{width:132px;height:132px;overflow:visible}
.forge-anim .hammer{transform-origin:87px 63px;animation:strike 1.1s cubic-bezier(.6,0,.4,1) infinite}
.forge-anim .sparks path{opacity:0;animation:spark 1.1s ease-out infinite}
.forge-anim .sparks path:nth-child(2){animation-delay:.03s}.forge-anim .sparks path:nth-child(3){animation-delay:.05s}.forge-anim .sparks path:nth-child(4){animation-delay:.02s}
.forge-anim .heat{opacity:.25;animation:heat 1.1s ease-out infinite}
@keyframes strike{0%{transform:rotate(22deg)}45%{transform:rotate(27deg)}62%{transform:rotate(-9deg)}70%{transform:rotate(-6deg)}100%{transform:rotate(22deg)}}
@keyframes spark{0%,60%{opacity:0;transform:translate(0,0)}66%{opacity:1}100%{opacity:0;transform:translate(-4px,-6px)}}
@keyframes heat{0%,58%{opacity:.18}66%{opacity:.85}100%{opacity:.18}}
@media (prefers-reduced-motion:reduce){.forge-anim .hammer,.forge-anim .sparks path,.forge-anim .heat{animation:none}.forge-anim .sparks path{opacity:.8}}
.gate h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.03em}.gate p{margin:0;color:var(--ash)}

@media (max-width:1000px){.viewer{grid-template-columns:minmax(0,1fr)}.viewer .info{max-height:none;border-left:0;border-top:1px solid var(--seam)}}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--seam)}
  .mark,.rail .gap{display:none}
  .rb{width:auto;flex:1}
  .work{padding:14px 12px 320px}
  .wall{column-width:150px;column-gap:8px}
  .tile{margin-bottom:8px}
  .dockwrap{left:0;bottom:64px;padding:0 8px}
  .dock{padding:10px;border-radius:18px}
  .dock textarea{font-size:16px;min-height:44px}
  .forge{min-width:0;flex:1 1 100%;margin-left:0}
  .purpose{flex-basis:100%}
  .top h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){.tile.forging::before{animation:none;opacity:.7}.spin{animation-duration:2.4s}.tile .cap{transition:none}}

}
SB.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_IN' && s && document.getElementById('lgf')) location.replace(location.origin + location.pathname); });   // 로그인 화면이 떠 있을 때만 (로그인된 채 열면 SIGNED_IN 이 와도 다시 불러오지 않음)

const boot = (pct, txt) => { const b = document.getElementById('bootbar'), s = document.getElementById('bootstep'); if (b) b.style.width = pct + '%'; if (s) s.textContent = txt; };
(async () => {
  boot(15, '로그인 확인하는 중');
  const { data: { session } } = await SB.auth.getSession();
  if (!session) { loginScreen(); return; }
  me = session.user;
  document.getElementById('logout').hidden = false;
  document.getElementById('logout').onclick = async () => { await SB.auth.signOut(); location.replace(location.origin + location.pathname); };
  SB.rpc('pt_ai_usage_can').then(({ data }) => { if (data) document.getElementById('nav-usage').hidden = false; });
  boot(35, '권한 확인하는 중');
  const { data: ok } = await SB.rpc('pt_sindri_can');
  if (!ok) { $app.innerHTML = `<div class="gate"><h1>신드리</h1><p>아직 열리지 않은 화면입니다. 지금은 Claude 에서 「이그드라실·궁니르」 커넥터로 힉스필드 이미지·영상을 만들 수 있습니다.</p><a class="btn" href="https://pantheon-map.vercel.app">판테온 지도로 돌아가기</a></div>`; return; }
  try {
    boot(55, '쓸 수 있는 모델 불러오는 중');
    const [, lm] = await Promise.all([loadModels(), mcp('hf_models', {}).catch(() => ({}))]);
    limit.limit = Number(lm.limit) || 0;
    boot(80, '내 아카이브 불러오는 중');
    await Promise.all([loadGens(), loadReqs()]);
    boot(100, '준비됐습니다');
  } catch (e) { $app.innerHTML = `<div class="gate"><h1>신드리</h1><p>불러오지 못했습니다: ${esc(e.message)}</p></div>`; return; }
  if (!models.length) { $app.innerHTML = `<div class="gate"><h1>신드리</h1><p><span class="spin" aria-hidden="true"></span> 쓸 수 있는 모델 목록을 준비하는 중입니다. 잠시 뒤 새로고침해 주세요.</p></div>`; return; }
  if (kind !== 'archive') pickDefault();
  render();
  setInterval(async () => { if (!document.hidden && $dlg.hidden) { const lm = await mcp('hf_models', {}).catch(() => null); if (lm?.limit != null) limit.limit = Number(lm.limit); await Promise.all([loadGens(), loadReqs()]).catch(() => {}); render(); } }, 60000);
})();
</script>
</body>
</html>
